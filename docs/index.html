<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PKC Sector Radar US</title>
<meta name="theme-color" content="#10233D">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,500..800&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout: navy market band (brand + pulse hero) on top, sticky tab bar (bottom bar on phones),
   white working cards on a cool-grey desk. One accent (marigold) marks the active place. */
:root{
  --desk:#EEF1F5; --card:#FFFFFF; --soft:#F5F7FA; --ink:#0F1A2A; --muted:#4D5868; --line:#D6DCE4; --track:#E4E9EF;
  --band:#10233D; --band2:#183253; --band-ink:#FFFFFF; --band-muted:#B9C6D8; --band-line:#2B4468;
  --accent:#E3A13A; --accent-ink:#8A5A00;
  --sel:#10233D; --sel-ink:#FFFFFF;
  --up:#0E8A6E; --down:#D4462C; --up-t:#0B6E58; --down-t:#B33A22;
  --s1:#1F5FAE; --s2:#C77D0A; --warn:#8A5A00; --warn-bg:#FFF6E3;
  --shadow:0 1px 2px rgba(15,26,42,.06),0 4px 14px rgba(15,26,42,.05);
  --display:"Archivo","Arial Narrow",Arial,sans-serif; --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --fs:17px; --r:10px;
  --f-b:#2a78d6; --f-o:#eb6834; --f-t:#1baf7a; --f-y:#eda100; --f-p:#e87ba4; --f-g:#008300;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --desk:#0B111B; --card:#141E2C; --soft:#1A2638; --ink:#EDF1F6; --muted:#A9B6C8; --line:#263347; --track:#223044;
  --band:#0A1524; --band2:#112035; --band-ink:#EDF1F6; --band-muted:#9FB0C6; --band-line:#22344F;
  --accent:#F0B456; --accent-ink:#F0B456; --sel:#DCE7F5; --sel-ink:#0B111B;
  --up:#1FA184; --down:#E35A3A; --up-t:#45C4A6; --down-t:#FF8A6E;
  --s1:#4C8BD8; --s2:#BF7F25; --warn:#F2C14E; --warn-bg:#2A2312;
  --shadow:0 1px 2px rgba(0,0,0,.4); color-scheme:dark;
  --f-b:#3987e5; --f-o:#d95926; --f-t:#199e70; --f-y:#c98500; --f-p:#d55181; --f-g:#008300;}}
:root[data-theme="dark"]{
  --desk:#0B111B; --card:#141E2C; --soft:#1A2638; --ink:#EDF1F6; --muted:#A9B6C8; --line:#263347; --track:#223044;
  --band:#0A1524; --band2:#112035; --band-ink:#EDF1F6; --band-muted:#9FB0C6; --band-line:#22344F;
  --accent:#F0B456; --accent-ink:#F0B456; --sel:#DCE7F5; --sel-ink:#0B111B;
  --up:#1FA184; --down:#E35A3A; --up-t:#45C4A6; --down-t:#FF8A6E;
  --s1:#4C8BD8; --s2:#BF7F25; --warn:#F2C14E; --warn-bg:#2A2312;
  --shadow:0 1px 2px rgba(0,0,0,.4); color-scheme:dark;
  --f-b:#3987e5; --f-o:#d95926; --f-t:#199e70; --f-y:#c98500; --f-p:#d55181; --f-g:#008300;}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-padding-top:70px}
body{margin:0;background:var(--desk);color:var(--ink);font:400 var(--fs)/1.5 var(--body);-webkit-font-smoothing:antialiased}
button,select,input{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:4px}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
.wrap{max-width:1260px;margin:0 auto;padding-inline:20px}
.up{color:var(--up-t)} .down{color:var(--down-t)}
h1,h2,h3,h4{font-family:var(--display);font-stretch:108%;margin:0;line-height:1.15;text-wrap:balance}
[hidden]{display:none!important}

/* ── Long bases ───────────────────────────────────────── */
.bdays{display:block;font-family:var(--display);font-weight:800;font-stretch:108%;font-size:23px;line-height:1.1}
.bsub{display:block;font-size:13.5px;color:var(--muted);font-weight:500;white-space:normal;max-width:260px}
.bdays+.bsub{min-width:128px}
.bch{display:block}.bch .box{fill:color-mix(in srgb,var(--accent) 20%,transparent)}
.bch text{font-size:13px;fill:var(--muted)}
.bchwrap{background:var(--soft);border-radius:10px;padding:8px 6px 2px}
button.btile{text-align:left;cursor:pointer;font:inherit;color:inherit;width:100%}
button.btile:hover{border-color:var(--accent)}
.tiles.btiles{grid-template-columns:repeat(4,minmax(0,1fr))}
.bxhead{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;padding:12px 14px 4px;font-size:17px}
.evid{margin-bottom:14px}
.evid summary{cursor:pointer;padding:14px 16px;font-family:var(--display);font-weight:800;font-size:21px;list-style:none}
.evid summary::-webkit-details-marker{display:none}
.evid summary::before{content:"▸";display:inline-block;width:22px;color:var(--accent-ink);transition:transform .15s}
.evid[open] summary::before{transform:rotate(90deg)}
.evid summary span{font-family:var(--body);font-weight:600;font-size:16px;color:var(--muted)}
.evb{padding:0 16px 14px}
.evb h4{font-family:var(--body);font-size:16px;font-weight:700;margin:16px 0 6px}
.evb .fl{margin:0;padding-left:22px}.evb .fl li{font-size:17px;margin:7px 0;max-width:95ch}
.etab td,.etab th{padding:7px 10px}
.ebar{display:inline-block;height:12px;background:var(--s1);border-radius:0 3px 3px 0;vertical-align:-1px;margin-right:8px}
.scorebd{margin-top:10px;background:var(--soft);border-radius:10px;padding:10px 12px}
.sbh{display:flex;justify-content:space-between;align-items:center;font-weight:700;margin-bottom:6px}
.sbr{display:grid;grid-template-columns:minmax(0,1fr) 120px 52px;gap:10px;align-items:center;font-size:15px;padding:3px 0}
.sbt{height:10px;background:var(--track);border-radius:5px;overflow:hidden}.sbt i{display:block;height:100%;background:var(--s1);border-radius:5px}
.sbr .num{text-align:right;font-weight:700}
@media (max-width:720px){.tiles.btiles{grid-template-columns:repeat(2,minmax(0,1fr))}.sbr{grid-template-columns:minmax(0,1fr) 80px 46px}}

/* ── Stage 2 phases ───────────────────────────────────── */
.subtabs{margin:0 0 14px}
.subtabs .seg button{font-size:17px;padding:8px 16px}
.phpill{display:inline-block;padding:2px 11px;border-radius:999px;font-size:15px;font-weight:800;letter-spacing:.2px;white-space:nowrap;line-height:1.45}
.ph-e{background:var(--up);color:#fff}.ph-m{background:var(--accent);color:#1b1305}.ph-l{background:var(--down);color:#fff}
.wchip{display:inline-block;font-size:13.5px;font-weight:600;padding:1px 8px;border-radius:6px;background:var(--warn-bg);color:var(--warn);border:1px solid color-mix(in srgb,var(--warn) 35%,transparent);margin:1px 0;white-space:nowrap}
.btile.t-e{box-shadow:inset 5px 0 0 var(--up),var(--shadow)}.btile.t-m{box-shadow:inset 5px 0 0 var(--accent),var(--shadow)}.btile.t-l{box-shadow:inset 5px 0 0 var(--down),var(--shadow)}
.egrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px 16px}
@media (max-width:1000px){.egrid{grid-template-columns:minmax(0,1fr)}}

/* ── Watchlists ───────────────────────────────────────── */
.wlbtn{border:0;background:none;cursor:pointer;font-size:19px;line-height:1;color:var(--muted);min-width:30px;min-height:30px;padding:0 6px 0 0;margin:-6px 0 -6px -4px;vertical-align:-2px;border-radius:6px}
.wlbtn:hover{color:var(--accent-ink)}
.wlbtn.on{color:var(--accent-ink)}
.wlbtn:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.wlbtn~.nm{padding-left:26px}
.scard .wlbtn{font-size:22px}
.wlpop{position:fixed;z-index:90;width:310px;max-width:calc(100vw - 24px);background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:14px;box-shadow:0 18px 44px rgba(5,15,30,.3);padding:12px}
.wlpop-h{font-size:15px;color:var(--muted);margin:2px 4px 8px}
.wlpop-h b{color:var(--ink);font-size:17px}
.wlrow{display:flex;align-items:center;gap:10px;padding:9px 8px;border-radius:9px;cursor:pointer;font-size:16px}
.wlrow:hover{background:var(--soft)}
.wlrow input{width:20px;height:20px;accent-color:var(--sel);flex:none}
.wlrow span:first-of-type{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wlrow .c,.wlchip .c{font-size:13px;font-weight:700;color:var(--muted);background:var(--soft);border:1px solid var(--line);border-radius:999px;padding:0 7px}
.wlpop-new{display:flex;gap:8px;margin:8px 4px 4px}
.wlpop-new input,.wlf input,.wlf textarea,.wlf select,.mdl input,.mdl textarea,.mdl select{font:inherit;font-size:16px;color:var(--ink);background:var(--card);border:1.5px solid var(--line);border-radius:9px;padding:8px 10px;min-height:42px;width:100%;min-width:0}
.wlpop-new input:focus,.wlf input:focus,.wlf textarea:focus,.mdl input:focus,.mdl textarea:focus{outline:none;border-color:var(--accent)}
.linkbtn{border:0;background:none;color:var(--s1);font-weight:600;cursor:pointer;padding:8px 4px;font-size:15px;text-decoration:underline;text-underline-offset:3px}
.wlpop .linkbtn{display:block;margin-top:2px}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);z-index:95;background:var(--ink);color:var(--card);padding:10px 16px;border-radius:10px;font-weight:600;box-shadow:0 8px 24px rgba(0,0,0,.3);max-width:calc(100vw - 32px)}
.wlbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.wlchip{border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:7px 14px;font-size:16px;font-weight:700;cursor:pointer;display:inline-flex;gap:8px;align-items:center;color:var(--ink)}
.wlchip[aria-pressed="true"]{background:var(--sel);color:var(--sel-ink);border-color:var(--sel)}
.wlchip[aria-pressed="true"] .c{background:transparent;color:inherit;border-color:currentColor}
.wlchip.add{border-style:dashed;color:var(--muted);font-weight:600}
.wltools{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.alerts{display:flex;flex-direction:column}
.al{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;align-items:baseline;padding:11px 16px;border-top:1px solid var(--track)}
.al:first-child{border-top:0}
.al .tag{font-size:13px;font-weight:800;letter-spacing:.03em;text-transform:uppercase;border-radius:6px;padding:2px 8px;white-space:nowrap}
.al .tag.crit{background:var(--down);color:#fff}.al .tag.warn{border:1.5px solid var(--down-t);color:var(--down-t)}
.al .tag.good{background:var(--up);color:#fff}.al .tag.info{border:1.5px solid var(--line);color:var(--muted)}
.al .txt{font-size:16px}.al .txt .ls{color:var(--muted);font-size:14px}
.fdot{display:inline-block;width:11px;height:11px;border-radius:50%;margin-right:6px;vertical-align:1px;box-shadow:0 0 0 1.5px rgba(0,0,0,.18)}
.fdot.b{background:var(--f-b)}.fdot.o{background:var(--f-o)}.fdot.t{background:var(--f-t)}.fdot.y{background:var(--f-y)}.fdot.p{background:var(--f-p)}.fdot.g{background:var(--f-g)}
.fpick{display:flex;flex-wrap:wrap;gap:6px}
.fpick label{display:inline-flex;align-items:center;gap:4px;border:1.5px solid var(--line);border-radius:999px;padding:5px 10px;cursor:pointer;font-size:14.5px;font-weight:600}
.fpick input{position:absolute;opacity:0;pointer-events:none}
.fpick label:has(input:checked){border-color:var(--ink);background:var(--soft)}
.fpick label:focus-within{outline:2px solid var(--accent)}
.spark{display:block}
.setup{font-size:13.5px;font-weight:700;border-radius:6px;padding:2px 8px;white-space:nowrap}
.setup.zone{background:var(--up);color:#fff}.setup.ext{border:1.5px solid var(--warn);color:var(--warn)}.setup.near{border:1.5px solid var(--up-t);color:var(--up-t)}
.setup.below{color:var(--muted);border:1.5px solid var(--line)}.setup.stop{background:var(--down);color:#fff}.setup.tgt{border:1.5px solid var(--s1);color:var(--s1)}
.rowact{display:inline-flex;gap:4px}
.rowact button{border:1.5px solid var(--line);background:var(--card);border-radius:8px;min-width:34px;height:34px;cursor:pointer;font-size:15px;color:var(--ink)}
.rowact button:hover{border-color:var(--muted)}
.wlf{display:flex;flex-direction:column;gap:12px}
.wlf .g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.wlf label.f{display:flex;flex-direction:column;gap:4px;font-size:14px;font-weight:600;color:var(--muted)}
.wlf .risk{background:var(--soft);border-radius:9px;padding:10px 12px;font-size:15px}
.wlmem{width:100%;border-collapse:collapse;font-size:15px}
.wlmem td{padding:6px 4px;border-bottom:1px solid var(--track);vertical-align:middle}
.wlmem td:first-child{font-weight:700}
.wlmem input{min-height:36px;padding:5px 8px;font-size:15px}
.wlmem input[type=date]{width:152px}.wlmem input[inputmode]{width:92px}
.mscrim{position:fixed;inset:0;background:rgba(5,12,22,.55);z-index:92}
.mdl{position:fixed;z-index:93;left:50%;top:50%;transform:translate(-50%,-50%);width:min(560px,calc(100vw - 24px));max-height:calc(100vh - 40px);overflow:auto;background:var(--card);color:var(--ink);border-radius:16px;box-shadow:0 24px 60px rgba(0,0,0,.35);padding:20px}
.mdl h3{font-size:22px;font-weight:800;margin-bottom:8px}
.mdl p{color:var(--muted);margin:6px 0 12px}
.mdl .acts{display:flex;justify-content:flex-end;gap:10px;margin-top:16px;flex-wrap:wrap}
.mdl .err{color:var(--down-t);font-weight:600}
.mdl ol{padding-left:22px;margin:8px 0}.mdl li{margin:4px 0}
.btn.danger{background:var(--down)}
.pchart{position:relative}
.pchart svg text{font-size:15px;fill:var(--muted);font-family:var(--body)}
.pchart .legend{margin:0 0 4px}
.track-rec{display:flex;flex-wrap:wrap;gap:8px 22px;padding:14px 16px;font-size:16px}
.track-rec b{font-size:22px;font-family:var(--display)}

/* ── Global stock search (in the band) ───────────────────── */
.gsearch{position:relative;flex:1;max-width:560px;margin-inline:auto}
.gsearch>svg{position:absolute;left:15px;top:50%;transform:translateY(-50%);color:var(--band-muted);pointer-events:none}
.gsearch input{width:100%;min-height:48px;padding:0 48px 0 46px;border-radius:999px;border:1.5px solid var(--band-line);background:rgba(255,255,255,.08);color:var(--band-ink);font:inherit;font-size:17px;font-weight:500}
.gsearch input::placeholder{color:var(--band-muted);opacity:1}
.gsearch input:focus{outline:none;border-color:var(--accent);background:rgba(255,255,255,.13)}
.gsearch input::-webkit-search-cancel-button{display:none}
.gsearch kbd{position:absolute;right:16px;top:50%;transform:translateY(-50%);font:600 13px/1 inherit;color:var(--band-muted);border:1px solid var(--band-line);border-radius:6px;padding:4px 8px}
.qres{position:absolute;left:0;right:0;top:calc(100% + 8px);background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:14px;box-shadow:0 20px 44px rgba(5,15,30,.32);z-index:70;max-height:min(70vh,560px);overflow:auto;padding:6px}
.qres .opt{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:2px 14px;width:100%;text-align:left;padding:10px 12px;border:0;background:none;border-radius:10px;cursor:pointer;color:inherit;font:inherit}
.qres .opt[aria-selected="true"],.qres .opt:hover{background:var(--soft)}
.qres .opt b{font-size:17px;font-weight:700;letter-spacing:.01em}
.qres .opt .nm{grid-column:1;font-size:14px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qres .opt .rt{grid-row:1/3;grid-column:2;text-align:right;font-size:15px}
.qres .opt .rt small{display:block;font-size:13px;color:var(--muted)}
.qres .opt mark{background:none;color:var(--accent-ink);text-decoration:underline;text-underline-offset:3px}
.qres .up{color:var(--up-t)}.qres .down{color:var(--down-t)}
.qres .none{padding:14px;color:var(--muted);font-size:15px}
.qres .hint{padding:8px 12px 4px;font-size:13px;color:var(--muted);border-top:1px solid var(--line);margin-top:4px}

/* ── Band: brand + market pulse ─────────────────────────── */
.band{background:linear-gradient(180deg,var(--band) 0%,var(--band2) 100%);color:var(--band-ink);padding-top:env(safe-area-inset-top,0px)}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:14px 6px}
.brand{display:flex;align-items:center;gap:12px;text-decoration:none}
.brand svg{flex:none}
.brand b{font-family:var(--display);font-weight:800;font-stretch:118%;font-size:24px;letter-spacing:.01em}
.brand span{display:block;font-size:14px;color:var(--band-muted);font-weight:500;margin-top:1px}
.iconbtn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:42px;padding:0 14px;border-radius:999px;border:1.5px solid var(--band-line);background:transparent;color:var(--band-ink);cursor:pointer;font-size:15px;font-weight:600}
.iconbtn:hover{border-color:var(--band-muted)}
.pulse{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1.6fr);gap:18px;padding-block:14px 22px}
.hero-idx{background:rgba(255,255,255,.04);border:1px solid var(--band-line);border-radius:14px;padding:16px 18px 10px;min-width:0}
.hero-idx .lab{display:flex;justify-content:space-between;gap:8px;color:var(--band-muted);font-size:15px;font-weight:600}
.hero-idx .val{font-family:var(--display);font-weight:800;font-stretch:112%;font-size:44px;line-height:1.05;margin-top:6px}
.hero-idx .chg{font-size:20px;font-weight:700;margin-left:10px}
.band .up{color:#5FD6B3} .band .down{color:#FF9479}
.spark{display:block;width:100%;height:76px;margin-top:6px}
.spark path.l{fill:none;stroke:var(--accent);stroke-width:2}
.spark path.a{fill:var(--accent);opacity:.12}
.minis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:10px}
.mini{display:flex;justify-content:space-between;gap:6px;font-size:15px;color:var(--band-muted);border-top:1px solid var(--band-line);padding-top:7px}
.mini b{color:var(--band-ink);font-weight:600}
.health{background:rgba(255,255,255,.04);border:1px solid var(--band-line);border-radius:14px;padding:16px 18px;min-width:0;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px 22px;align-content:start}
.verdict{grid-column:1/-1;display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 14px}
.verdict .k{color:var(--band-muted);font-size:15px;font-weight:600}
.verdict .v{font-family:var(--display);font-weight:800;font-stretch:112%;font-size:30px}
.verdict .why{color:var(--band-muted);font-size:15px}
.hm .k{display:flex;justify-content:space-between;font-size:15px;color:var(--band-muted)}
.hm .k b{color:var(--band-ink);font-size:17px}
.meter{position:relative;height:10px;border-radius:5px;background:var(--band-line);margin-top:7px;overflow:hidden}
.meter i{position:absolute;inset:0 auto 0 0;background:var(--accent);border-radius:5px}
.meter.split i{background:#33B892} .meter.split i+i{left:auto;right:0;background:#F06A4D}
.meter .tick{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--band-ink);opacity:.55}

/* ── Tabs ─────────────────────────────────────────────── */
.tabbar{position:sticky;top:0;z-index:30;background:var(--card);border-bottom:1px solid var(--line);box-shadow:var(--shadow)}
.tabbar .wrap{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
.tabbar .wrap::-webkit-scrollbar{display:none}
.tab{display:flex;align-items:center;gap:9px;padding:15px 16px 13px;border:0;background:none;cursor:pointer;color:var(--muted);font-weight:600;font-size:17px;white-space:nowrap;border-bottom:3px solid transparent}
.tab svg{width:21px;height:21px;flex:none}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.tab:hover{color:var(--ink)}
.tab .cnt:empty{display:none}
.tab .ls{display:none}
.tab .cnt{font-size:13px;font-weight:700;background:var(--soft);border:1px solid var(--line);border-radius:999px;padding:0 7px;color:var(--muted)}

main.wrap{padding-block:22px 40px;min-height:60vh}
.sec-head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:8px 16px;margin-bottom:14px}
.sec-head h2{font-size:28px;font-weight:800}
.sec-head p{margin:4px 0 0;color:var(--muted);font-size:16px;max-width:72ch}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.pad{padding:16px 18px}
.toolbar{display:flex;flex-wrap:wrap;gap:12px 22px;align-items:flex-end;padding:14px 16px;margin-bottom:14px}
.ctl{display:flex;flex-direction:column;gap:5px;min-width:0}
.ctl>span{font-size:14px;font-weight:600;color:var(--muted)}
.seg{display:inline-flex;flex-wrap:wrap;background:var(--soft);border:1px solid var(--line);border-radius:9px;padding:3px;gap:2px;max-width:100%}
.seg button{border:0;background:none;padding:7px 12px;border-radius:7px;cursor:pointer;font-weight:600;font-size:16px;color:var(--muted);white-space:nowrap}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed="true"]{background:var(--sel);color:var(--sel-ink);box-shadow:0 1px 2px rgba(0,0,0,.15)}
.select,.search{background:var(--card);border:1.5px solid var(--line);border-radius:9px;padding:8px 12px;min-height:42px;max-width:100%}
.search{width:240px}
.check{display:inline-flex;align-items:center;gap:8px;cursor:pointer;font-weight:500;min-height:42px}
.check input{width:20px;height:20px;accent-color:var(--sel)}
.note{color:var(--muted);font-size:15px;margin:12px 2px 0;max-width:90ch}
.empty{padding:22px 18px;color:var(--muted)}
.err{padding:18px 20px;border:2px solid var(--down);border-radius:var(--r);background:var(--card)}
.warnbox{border:1.5px solid var(--warn);background:var(--warn-bg);border-radius:var(--r);padding:12px 16px;margin-bottom:12px}

/* pills */
.pill{display:inline-block;padding:1px 9px;border-radius:999px;font-size:14px;font-weight:700;white-space:nowrap;border:1.5px solid currentColor;line-height:1.5}
.p-up{color:var(--up-t)} .p-down{color:var(--down-t)} .p-mut{color:var(--muted)} .p-acc{color:var(--accent-ink)}
.rs{display:inline-block;min-width:38px;text-align:center;padding:1px 6px;border-radius:6px;font-weight:700;font-size:15px}
.rs-a{background:var(--up);color:#fff} .rs-b{background:color-mix(in srgb,var(--up) 22%,transparent);color:var(--up-t)} .rs-c{background:var(--soft);color:var(--muted)} .rs-d{background:color-mix(in srgb,var(--down) 18%,transparent);color:var(--down-t)}

/* ── Rotation ─────────────────────────────────────────── */
.rows{padding:4px 0}
.brow{display:grid;grid-template-columns:minmax(170px,1.25fr) minmax(0,2.3fr) 92px 58px;align-items:center;gap:6px 14px;padding:10px 18px;cursor:pointer;border-top:1px solid var(--track)}
.brow:first-child{border-top:0}
.brow:hover{background:var(--soft)}
.brow[aria-expanded="true"]{background:var(--soft)}
.bname{font-weight:600;font-size:17px;line-height:1.25;min-width:0}
.bname .cnt{color:var(--muted);font-weight:500;font-size:14px;margin-left:6px}
.bname .lead{display:block;font-weight:400;font-size:14px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.btrack{position:relative;height:24px}
.btrack .zero{position:absolute;left:50%;top:-5px;bottom:-5px;width:1.5px;background:var(--muted);opacity:.6}
.btrack .fill{position:absolute;top:4px;bottom:4px}
.fill.pos{background:var(--up);border-radius:0 4px 4px 0} .fill.neg{background:var(--down);border-radius:4px 0 0 4px}
.bval{text-align:right;font-size:19px;font-weight:700}
.rk{font-size:15px;font-weight:600;text-align:right;color:var(--muted)}
.rk.gain{color:var(--up-t)} .rk.loss{color:var(--down-t)}
.members{grid-column:1/-1;cursor:default;padding:4px 0 8px}
.members .meta{font-size:15px;color:var(--muted);margin:2px 0 8px}
.heat{width:100%;border-collapse:separate;border-spacing:0}
.heat th{font-size:14px;color:var(--muted);font-weight:600;padding:10px 8px;text-align:center;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--card);cursor:pointer}
.heat th:first-child{text-align:left;padding-left:16px}
.heat td{padding:3px;text-align:center}
.heat td:first-child{text-align:left;padding:8px 16px;font-weight:600;white-space:nowrap}
.heat .cell{border-radius:6px;padding:8px 4px;font-weight:600;font-size:15px;min-width:64px}
.heat tr.hr{cursor:pointer}.heat tr.hr:hover td:first-child{text-decoration:underline}
.heat th.on{color:var(--ink);box-shadow:inset 0 -3px 0 var(--accent)}

/* ── Tables ───────────────────────────────────────────── */
.tscroll{overflow:auto;max-height:74vh;-webkit-overflow-scrolling:touch}
table.dt{border-collapse:separate;border-spacing:0;width:100%;font-size:16px}
.dt th,.dt td{padding:9px 12px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--track)}
.dt th{font-size:14px;font-weight:600;color:var(--muted);position:sticky;top:0;background:var(--card);z-index:2;cursor:pointer;user-select:none}
.dt th:hover{color:var(--ink)}
.dt th.l,.dt td.l{text-align:left}
.dt td.wrapcell{white-space:normal;min-width:160px;max-width:300px;text-align:left}
.dt th:first-child,.dt td:first-child{position:sticky;left:0;background:var(--card);z-index:1;text-align:left;box-shadow:1px 0 0 var(--track)}
.dt th:first-child{z-index:3}
.dt tbody tr:hover td{background:var(--soft)}
.symbtn{border:0;background:none;padding:0;cursor:pointer;text-align:left;font-weight:700;color:var(--ink);text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px;text-decoration-thickness:2px}
.symbtn:hover{text-decoration-color:var(--accent)}
.nm{display:block;font-size:14px;color:var(--muted);font-weight:400;max-width:220px;overflow:hidden;text-overflow:ellipsis}
.tfoot{display:flex;flex-wrap:wrap;gap:8px 16px;justify-content:space-between;align-items:center;padding:10px 14px;color:var(--muted);font-size:15px;border-top:1px solid var(--track)}
.ghost{background:none;border:1.5px solid var(--line);border-radius:8px;padding:6px 12px;cursor:pointer;font-weight:600;font-size:15px}
.ghost:hover{border-color:var(--muted)}

/* ── Breadth ──────────────────────────────────────────── */
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-bottom:14px}
.tile{padding:14px 16px}
.tile .k{color:var(--muted);font-size:15px;font-weight:600}
.tile .v{font-family:var(--display);font-weight:800;font-stretch:108%;font-size:34px;line-height:1.15;margin-top:2px}
.tile .d{font-size:15px;margin-top:2px}
.tile .bar{height:8px;border-radius:4px;background:var(--track);margin-top:10px;position:relative;overflow:hidden}
.tile .bar i{position:absolute;inset:0 auto 0 0;background:var(--s1);border-radius:4px}
.chart{padding:14px 14px 8px;margin-bottom:14px;position:relative}
.chart h3{font-size:19px;margin:2px 4px 4px}
.legend{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:15px;color:var(--muted);margin:4px 4px 6px}
.legend span{display:inline-flex;align-items:center;gap:7px}
.legend i{display:inline-block;width:18px;height:3px;border-radius:2px;background:var(--c)}
.legend i.dash{background:repeating-linear-gradient(90deg,var(--c) 0 5px,transparent 5px 9px)}
svg text{fill:var(--muted);font:500 13px var(--body)}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--card);border-radius:8px;padding:8px 10px;font-size:14px;line-height:1.45;white-space:nowrap;z-index:5;box-shadow:0 4px 14px rgba(0,0,0,.25)}
.tip b{font-weight:700}

/* ── Scanners ─────────────────────────────────────────── */
.scan-layout{display:grid;grid-template-columns:300px minmax(0,1fr);gap:16px;align-items:start}
.rail{position:sticky;top:72px;max-height:calc(100vh - 90px);overflow:auto;padding:8px 0}
.rail h4{font-size:14px;font-weight:700;color:var(--muted);font-family:var(--body);padding:12px 16px 4px;letter-spacing:.02em}
.rail button{display:flex;width:100%;justify-content:space-between;gap:10px;align-items:center;border:0;background:none;padding:8px 16px;text-align:left;cursor:pointer;font-size:16px;color:var(--ink);border-left:3px solid transparent}
.rail button:hover{background:var(--soft)}
.rail button[aria-current="true"]{background:var(--soft);border-left-color:var(--accent);font-weight:700}
.rail button .c{font-size:14px;font-weight:700;min-width:30px;text-align:center;padding:0 7px;border-radius:999px;background:var(--soft);border:1px solid var(--line);color:var(--muted)}
.rail button .c.z{opacity:.55}
.scan-pick{display:none}
.scan-head{padding:16px 18px 12px;border-bottom:1px solid var(--track)}
.scan-head h3{font-size:24px;font-weight:800}
.scan-head .cnt{font-family:var(--display);font-weight:800;font-size:24px;color:var(--accent-ink);margin-left:8px}
.scan-head p{margin:6px 0 0;color:var(--muted);max-width:80ch}
.catchips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}

/* ── VPCI ─────────────────────────────────────────────── */
.vstats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:12px}
.funnel{padding:14px 16px;margin-bottom:12px}
.funnel h3{font-size:19px;margin-bottom:8px}
.frow{display:grid;grid-template-columns:230px minmax(0,1fr) 64px;gap:10px;align-items:center;padding:4px 0;font-size:15px}
.frow .bar{height:16px;border-radius:0 4px 4px 0;background:var(--s1)}
.frow .lbl{color:var(--ink);font-weight:600}
.frow .lbl small{display:block;font-weight:400;color:var(--muted);font-size:13px}
.frow .n{text-align:right;font-weight:700}
.badges{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:2px 0 12px;font-size:15px}
.badge{display:inline-block;padding:2px 11px;border-radius:999px;font-size:14px;font-weight:600;border:1.5px solid var(--line);color:var(--ink);background:var(--card)}
.badge.ok{border-color:var(--up);color:var(--up-t)} .badge.off{border-color:var(--down);color:var(--down-t)}
.subtabs{display:flex;gap:6px;overflow-x:auto;padding:2px 2px 6px;margin:12px 0 12px;scrollbar-width:thin}
.subtabs button{flex:none;background:var(--card);border:1.5px solid var(--line);border-radius:999px;padding:8px 14px;cursor:pointer;font-weight:600;font-size:16px;white-space:nowrap}
.subtabs button .c{font-size:13px;color:var(--muted);margin-left:6px;font-weight:700}
.subtabs button[aria-pressed="true"]{background:var(--sel);color:var(--sel-ink);border-color:var(--sel)}
.subtabs button[aria-pressed="true"] .c{color:inherit;opacity:.8}
.gates{display:inline-flex;gap:3px;vertical-align:middle}
.gates i{width:12px;height:12px;border-radius:50%;border:2px solid var(--muted);display:inline-block}
.gates i.on{background:var(--up);border-color:var(--up)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:12px}
.scard{padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.scard .t{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.scard .sym{font-family:var(--display);font-weight:800;font-stretch:108%;font-size:22px}
.scard .sym .symbtn{font-size:22px}
.scard .co{color:var(--muted);font-size:15px;line-height:1.3}
.scard .px{font-family:var(--display);font-weight:700;font-size:22px;text-align:right}
.scard dl{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px 10px;margin:0}
.scard dt{font-size:13px;color:var(--muted);font-weight:600}
.scard dd{margin:0;font-weight:700;font-size:16px}
.scard .state{font-size:15px;color:var(--muted)}
.vtools{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;margin-bottom:10px}
.sbar{display:inline-block;height:8px;border-radius:0 4px 4px 0;background:var(--s1);vertical-align:middle;margin-right:8px}
.hbar{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,2fr) 90px;gap:10px;align-items:center;padding:6px 0;font-size:15px;border-top:1px solid var(--track)}
.hbar:first-child{border-top:0}
.hbar .b{height:14px;border-radius:0 4px 4px 0;background:var(--up)}
.cols2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
details.exp{margin:12px 0;background:var(--card);border:1px solid var(--line);border-radius:var(--r)}
details.exp>summary{cursor:pointer;padding:12px 16px;font-weight:600}
details.exp>div{padding:0 0 8px}

/* ── Drawer ───────────────────────────────────────────── */
.scrim{position:fixed;inset:0;background:rgba(5,12,22,.62);z-index:60}
/* Stock window: a large centred window on PC, full screen on phones */
.drawer{position:fixed;z-index:61;top:2.5vh;left:0;right:0;margin-inline:auto;width:min(1280px,96vw);height:95vh;background:var(--card);color:var(--ink);border-radius:16px;box-shadow:0 28px 80px rgba(0,0,0,.45);display:flex;flex-direction:column;overflow:hidden}
.drawer header{display:grid;grid-template-columns:minmax(0,1fr) auto auto;align-items:center;gap:8px 20px;padding:16px 22px 12px;border-bottom:1px solid var(--line);background:var(--card)}
.drawer h2{font-size:34px;font-weight:800;line-height:1.05}
.drawer .co{color:var(--muted);margin-top:3px;font-size:16px}
.drawer .dprice{display:flex;align-items:baseline;gap:6px 14px;flex-wrap:wrap;justify-content:flex-end;text-align:right}
.drawer .dprice .px{font-family:var(--display);font-weight:800;font-size:32px}
.drawer .dprice .chg{font-weight:700;font-size:19px}
.drawer .dprice .mc{font-size:16px;color:var(--muted);flex-basis:100%}
.drawer .dacts{display:flex;gap:8px;align-items:center}
.drawer .dacts .ghost{min-height:44px;display:inline-flex;align-items:center;text-decoration:none;font-size:16px;padding:0 14px}
.drawer .close{display:inline-flex;align-items:center;gap:8px;border:2px solid var(--ink);background:var(--card);color:var(--ink);border-radius:10px;min-height:44px;padding:0 16px;cursor:pointer;font-size:17px;font-weight:800;flex:none}
.drawer .close:hover{background:var(--ink);color:var(--card)}
.drawer .close b{font-size:22px;line-height:1}
.dnav{grid-column:1/-1;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:2px -4px 0;padding:2px 4px}
.dnav::-webkit-scrollbar{display:none}
.dnav button{flex:none;border:1.5px solid var(--line);background:var(--soft);border-radius:999px;padding:5px 13px;font-size:15px;font-weight:600;cursor:pointer;color:var(--ink)}
.dnav button:hover{border-color:var(--accent)}
.drawer .body{overflow:auto;overscroll-behavior:contain;padding:18px 22px calc(28px + env(safe-area-inset-bottom,0px));scroll-padding-top:12px}
.dcols{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:22px;align-items:start}
.dcol{display:flex;flex-direction:column;gap:18px;min-width:0}
.dcol .dsec{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.dcol .dsec h4{font-size:16px}
.dcol>div:empty{display:none}
@media (max-width:1000px){
  .drawer{top:0;width:100%;height:100%;height:100dvh;border-radius:0;padding-top:env(safe-area-inset-top,0px)}
  .dcols{grid-template-columns:minmax(0,1fr)}
}
.fscroll{overflow-x:auto;-webkit-overflow-scrolling:touch;margin-top:10px;border:1px solid var(--line);border-radius:10px}
.ftbl{width:100%;border-collapse:collapse;font-size:15px}
.ftbl th,.ftbl td{padding:7px 9px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
.ftbl tr:last-child td{border-bottom:0}
.ftbl th:first-child,.ftbl td:first-child{text-align:left;position:sticky;left:0;background:var(--card)}
.ftbl th{color:var(--muted);font-weight:600;font-size:13.5px;background:var(--soft)}
.flags{margin:8px 0 0;padding-left:20px;color:var(--down-t);font-weight:600}
.flags li{margin:3px 0}
.dsub{font-size:14px;color:var(--muted);margin:12px 0 0;font-weight:600}
.dgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin:0}
.dgrid div{background:var(--soft);border-radius:8px;padding:8px 10px;min-width:0}
.dgrid dt{font-size:13px;color:var(--muted);font-weight:600}
.dgrid dd{margin:0;font-weight:700;font-size:17px}
.dsec h4{font-family:var(--body);font-size:15px;color:var(--muted);font-weight:700;margin-bottom:8px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chipbtn{border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:4px 12px;font-size:15px;cursor:pointer;font-weight:600}
.chipbtn:hover{border-color:var(--accent)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border-radius:10px;background:var(--sel);color:var(--sel-ink);font-weight:700;text-decoration:none;border:0;cursor:pointer}
.btn.alt{background:var(--card);color:var(--ink);border:1.5px solid var(--line)}

footer.foot{color:var(--muted);font-size:15px;padding-block:6px 30px}
footer.foot p{margin:4px 0;max-width:110ch}

/* ── Responsive ───────────────────────────────────────── */
@media (max-width:1000px){
  .pulse{grid-template-columns:minmax(0,1fr)}
  .scan-layout{grid-template-columns:minmax(0,1fr)}
  .rail{display:none}
  .scan-pick{display:block;margin-bottom:12px}
  .vstats{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:720px){
  :root{--fs:16px}
  .wrap{padding-inline:16px}
  .brand b{font-size:21px}
  .topbar{flex-wrap:wrap}
  .gsearch{order:3;flex-basis:100%;max-width:none;margin:4px 0 2px}
  .gsearch kbd{display:none}
  .wlpop.sheet{left:0!important;right:0;top:auto!important;bottom:0;width:100%;max-width:none;border-radius:16px 16px 0 0;padding:14px 14px calc(18px + env(safe-area-inset-bottom,0px))}
  .wlf .g3{grid-template-columns:repeat(2,minmax(0,1fr))}
  .wlmem input[type=date]{width:130px;font-size:14px;padding:5px 4px}.wlmem input[inputmode]{width:76px}.wlmem td{padding:6px 2px}
  .toast{bottom:84px}
  #themeBtn span{display:none}
  .topbar .brand{flex:1;min-width:0}
  #themeBtn{flex:none}
  #themeBtn{padding:0 12px}
  .hero-idx .val{font-size:36px}
  .health{grid-template-columns:minmax(0,1fr)}
  .verdict .v{font-size:27px}
  .tabbar{position:fixed;top:auto;bottom:0;left:0;right:0;border-top:1px solid var(--line);border-bottom:0;padding-bottom:env(safe-area-inset-bottom,0px)}
  .tabbar .wrap{padding-inline:4px;gap:0;justify-content:space-between}
  .tab{flex:1;flex-direction:column;gap:3px;padding:9px 2px 8px;font-size:12.5px;border-bottom:0;border-top:3px solid transparent;min-width:0}
  .tab[aria-selected="true"]{border-top-color:var(--accent)}
  .tab .cnt{display:none}
  .tab .lf{display:none}.tab .ls{display:inline}
  main.wrap{padding-bottom:110px}
  footer.foot{padding-bottom:110px}
  .sec-head h2{font-size:24px}
  .brow{grid-template-columns:minmax(0,1fr) 84px 46px;padding:10px 14px}
  .btrack{grid-column:1/-1;grid-row:2}
  .tiles{grid-template-columns:repeat(2,minmax(0,1fr))}
  .tile .v{font-size:28px}
  .search{width:100%}
  .toolbar .ctl{width:100%}
  .cols2{grid-template-columns:minmax(0,1fr)}
  .frow{grid-template-columns:120px minmax(0,1fr) 54px}
  .frow .lbl small{display:none}
  .dgrid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .drawer header{grid-template-columns:minmax(0,1fr) auto;padding:12px 14px 10px;gap:6px 10px}
  .drawer h2{font-size:27px}
  .drawer .co{font-size:15px}
  .drawer .dprice{grid-column:1/-1;grid-row:2;justify-content:flex-start;text-align:left}
  .drawer .dprice .px{font-size:28px}.drawer .dprice .mc{flex-basis:auto}
  .drawer .dacts{grid-column:2;grid-row:1;align-self:start}
  .drawer .dacts .tvl{display:none}
  .drawer .close{min-height:46px;padding:0 14px}
  .drawer .body{padding:12px 12px calc(28px + env(safe-area-inset-bottom,0px))}
  .dcol{gap:14px}.dcol .dsec{padding:12px}
}
@media (prefers-reduced-motion:no-preference){
  .fill,.meter i,.tile .bar i,.frow .bar{transition:width .35s ease,left .35s ease}
  .drawer{animation:slidein .2s ease}
  @keyframes slidein{from{transform:translateY(24px);opacity:.4}to{transform:none;opacity:1}}
}
</style>
</head>
<body>
<header class="band">

<script>
/* ════════════════════ state & helpers ════════════════════ */
const PERIODS=["1D","1W","1M","3M","6M","YTD","1Y"];

const st={tab:"rotation",period:"1M",group:"Themes",etfSet:"US sectors",agg:"mean",sort:"ret",view:"bars",open:null,scan:"combo3",scanTop:0,scanFund:0,
  rs:{q:"",sec:"",theme:"",min:0,fmin:0,tt:false,s2:false,a50:false,kind:"s"},tbl:{}};
let D={};
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const isNum=v=>typeof v==="number"&&isFinite(v);
const sgn=(v,d=2,u="%")=>!isNum(v)?"–":(v>0?"+":v<0?"−":"")+Math.abs(v).toFixed(d)+u;
const cls=v=>!isNum(v)?"":v>0?"up":v<0?"down":"";
const inr=v=>!isNum(v)?"–":v.toLocaleString("en-US",{minimumFractionDigits:v>=1000?0:2,maximumFractionDigits:v>=1000?0:2});
const mcap=v=>!isNum(v)?"–":v>=1e6?"$"+(v/1e6).toFixed(2)+"T":v>=1e3?"$"+(v/1e3).toFixed(v>=1e5?0:1)+"B":"$"+Math.round(v)+"M";
const usdM=v=>!isNum(v)?"–":(v<0?"−":"")+(a=>a>=1000?"$"+(a/1000).toFixed(a>=1e5?0:1)+"B":a>=1?"$"+(a>=100?Math.round(a):a.toFixed(1))+"M":"$"+Math.round(a*1000)+"K")(Math.abs(v));
const mean=a=>a.reduce((x,y)=>x+y,0)/a.length;
const median=a=>{const b=[...a].sort((x,y)=>x-y),m=b.length>>1;return b.length%2?b[m]:(b[m-1]+b[m])/2};
const store={get(k,d){try{const v=localStorage.getItem("radarus."+k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem("radarus."+k,JSON.stringify(v))}catch(e){}}};
const TVX=new Set(["NASDAQ","NYSE","AMEX","CBOE","IEX"]);
const tv=(s,ex)=>`https://www.tradingview.com/chart/?symbol=${encodeURIComponent((TVX.has(ex)?ex+":":"")+s)}`;
function seg(name,opts,cur,labels){return `<div class="seg" role="group" aria-label="${esc(name)}">`+opts.map(o=>`<button type="button" data-seg="${name}" data-val="${esc(o)}" aria-pressed="${o===cur}">${esc(labels?labels[o]:o)}</button>`).join("")+`</div>`}
function rsPill(v){if(!isNum(v))return "–";const c=v>=90?"rs-a":v>=70?"rs-b":v>=40?"rs-c":"rs-d";return `<span class="rs ${c}">${v}</span>`}
function stagePill(s){return !s?"–":s===2?`<span class="pill p-up">Stage 2</span>`:s===4?`<span class="pill p-down">Stage 4</span>`:s===1?`<span class="pill p-mut">Stage 1</span>`:`<span class="pill p-mut">Stage 3</span>`}
const symBtn=(s,n,ex)=>wlStar(s)+`<button type="button" class="symbtn" data-sym="${esc(s)}"${ex?` data-ex="${esc(ex)}"`:""}>${esc(s)}</button>${n?`<span class="nm">${esc(n)}</span>`:""}`;
function fmtDate(d){if(!d)return"";const t=new Date(String(d).slice(0,10)+"T00:00:00");return isNaN(t)?String(d):t.toLocaleDateString("en-US",{day:"numeric",month:"short",year:"numeric"})}

/* ════════════════════ data ════════════════════ */
async function load(){
  if(window.EMBED){D=window.EMBED;return}
  const get=n=>fetch(`data/${n}.json?v=${Date.now()}`).then(r=>{if(!r.ok)throw new Error(`${n}.json (${r.status})`);return r.json()});
  const [meta,stocks,groups,breadth,scans]=await Promise.all(["meta","stocks","groups","breadth","scans"].map(get));
  D={meta,stocks,groups,breadth,scans};
}
function index(){
  D.by=Object.fromEntries(D.stocks.map(s=>[s.s,s]));
  D.themesOf={};for(const [t,ss] of Object.entries(D.groups.Themes||{}))for(const s of ss)(D.themesOf[s]=D.themesOf[s]||[]).push(t);
  D.scansOf={};const sc=D.scans||{};
  if(sc.meta)for(const m of sc.meta)for(const s of (sc.hits[m.id]||[]))(D.scansOf[s]=D.scansOf[s]||[]).push(m.id);
  D.scanMeta=Object.fromEntries((sc.meta||[]).map(m=>[m.id,m]));
}

/* ════════════════════ header & pulse ════════════════════ */
function renderHeader(){

}
function renderPulse(){

  const r=main?.r?.[st.period];
  const N=Math.min(130,b.bench.length),ser=b.bench.slice(-N),vals=ser.filter(isNum);
  let spark="";
  if(vals.length>2){const lo=Math.min(...vals),hi=Math.max(...vals),W=400,H=76,x=i=>i*(W/(N-1)),y=v=>H-4-(v-lo)/(hi-lo||1)*(H-10);
    let d="";ser.forEach((v,i)=>{if(isNum(v))d+=(d?"L":"M")+x(i).toFixed(1)+","+y(v).toFixed(1)});
    spark=`<svg class="spark" viewBox="0 0 400 76" preserveAspectRatio="none" role="img" aria-label="${esc(bn)} over the last ${N} sessions"><path class="a" d="${d}L${W},${H}L0,${H}Z"/><path class="l" d="${d}"/></svg>`}
  const others=Object.entries(ix).filter(([k])=>k!==bn);
  const a50=b.a50[L],a200=b.a200[L],adv=b.adv[L],dec=b.dec[L],nh=b.nh[L],nl=b.nl[L],u4=b.up4[L],d4=b.dn4[L];
  const vd=a50>=60?["Strong","up"]:a50>=40?["Mixed",""]:["Weak","down"];
  const d50=a50-b.a50[Math.max(0,L-5)],tt=(D.scans?.hits?.trend_template||[]).length;
  const split=(a,c)=>{const t=a+c||1;return `<div class="meter split" aria-hidden="true"><i style="width:${a/t*100}%"></i><i style="width:${c/t*100}%"></i></div>`};
  $("#pulse").innerHTML=`
  <div class="hero-idx">
    <div class="lab"><span>${esc(bn)}</span><span>${st.period==="1D"?"Today":PL[st.period]+" change"}</span></div>
    <div><span class="val num">${main?inr(main.px):"–"}</span><span class="chg num ${cls(r)}">${sgn(r)}</span></div>
    ${spark}
    <div class="minis">${others.map(([k,v])=>`<div class="mini"><span>${esc(k)}</span><b class="num ${cls(v.r[st.period])}">${sgn(v.r[st.period])}</b></div>`).join("")}</div>
  </div>
  <div class="health">
    <div class="verdict"><span class="k">Breadth reading</span><span class="v ${vd[1]}" style="${vd[1]?"":"color:var(--accent)"}">${vd[0]}</span>
      <span class="why">${a50.toFixed(1)}% of ${m.universe.toLocaleString("en-US")} stocks above their 50 DMA · <span class="${cls(d50)}">${d50>0?"+":""}${d50.toFixed(1)} pts</span> in a week</span></div>
    <div class="hm"><div class="k"><span>Above 50 DMA</span><b class="num">${a50.toFixed(1)}%</b></div><div class="meter"><i style="width:${a50}%"></i><span class="tick" style="left:50%"></span></div></div>
    <div class="hm"><div class="k"><span>Above 200 DMA</span><b class="num">${a200.toFixed(1)}%</b></div><div class="meter"><i style="width:${a200}%"></i><span class="tick" style="left:50%"></span></div></div>
    <div class="hm"><div class="k"><span>Advances / declines</span><b class="num"><span class="up">${adv}</span> / <span class="down">${dec}</span></b></div>${split(adv,dec)}</div>
    <div class="hm"><div class="k"><span>52-week highs / lows</span><b class="num"><span class="up">${nh}</span> / <span class="down">${nl}</span></b></div>${split(nh,nl)}</div>
    <div class="hm"><div class="k"><span>Up 4%+ / down 4%+</span><b class="num"><span class="up">${u4}</span> / <span class="down">${d4}</span></b></div>${split(u4,d4)}</div>
    <div class="hm"><div class="k"><span>Pass Minervini trend template</span><b class="num">${tt} <span style="color:var(--band-muted);font-weight:500;font-size:15px">(${(tt/m.universe*100).toFixed(1)}%)</span></b></div><div class="meter"><i style="width:${Math.min(100,tt/m.universe*100)}%"></i></div></div>
  </div>`;
}
/* where to press "Run workflow": the repo that published this site */
function repoUrl(){const r=D.meta?.repo||(location.hostname.endsWith(".github.io")?location.hostname.split(".")[0]+"/"+(location.pathname.split("/").filter(Boolean)[0]||""):"");return r&&r.includes("/")&&!r.endsWith("/")?`https://github.com/${r}`:null}
function updUrl(){const r=repoUrl();return r?`${r}/actions/workflows/daily.yml`:null}
function dataAge(){const a=new Date(D.meta.asof+"T00:00:00"),n=new Date();let d=0;for(let t=new Date(a);t<n;t.setDate(t.getDate()+1)){const w=t.getDay();if(t>a&&w!==0&&w!==6)d++}return Math.max(0,d-1)}  // US sessions missed
function staleNote(){const n=dataAge();if(n<1)return "";const u=updUrl();
  return `<div class="warnbox" style="display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:space-between"><span>📅 Data is from the US close on <b>${esc(fmtDate(D.meta.asof))}</b> — about ${n} trading day${n>1?"s":""} old.</span>${u?`<a class="btn" href="${u}" target="_blank" rel="noopener">Update now ↗</a>`:""}</div>`}
function renderFoot(){

}

/* ════════════════════ generic table ════════════════════ */
const TBL={};
function dtable(id,rows,cols,{limit=100,empty="Nothing to show.",csv=true}={}){
  const T=st.tbl[id]||(st.tbl[id]={key:null,dir:-1,show:limit});
  if(!rows.length)return `<div class="empty">${esc(empty)}</div>`;
  let data=rows;
  if(T.key){const c=cols.find(c=>c.k===T.key);if(c){const f=c.sort||(r=>r[c.k]);data=[...rows].sort((a,b)=>{const A=f(a),B=f(b);if(A==null||A==="")return 1;if(B==null||B==="")return -1;return typeof A==="string"?T.dir*A.localeCompare(B):T.dir*(A-B)})}}
  const vis=data.slice(0,T.show);
  let h=`<div class="tscroll"><table class="dt" data-tid="${esc(id)}"><thead><tr>${cols.map(c=>`<th class="${c.l?"l":""}" data-k="${esc(c.k)}" tabindex="0" aria-sort="${T.key===c.k?(T.dir<0?"descending":"ascending"):"none"}">${esc(c.label)}${T.key===c.k?(T.dir<0?" ▼":" ▲"):""}</th>`).join("")}</tr></thead><tbody>`;
  for(const r of vis)h+="<tr>"+cols.map(c=>`<td class="${c.l?"l ":""}${c.td?c.td(r):""}">${c.fmt?c.fmt(r):esc(r[c.k]??"–")}</td>`).join("")+"</tr>";
  h+=`</tbody></table></div><div class="tfoot"><span>${rows.length.toLocaleString("en-US")} rows${rows.length>T.show?` · showing ${T.show}`:""}</span><span>`;
  if(rows.length>T.show)h+=`<button class="ghost" type="button" data-more="${esc(id)}">Show ${Math.min(100,rows.length-T.show)} more</button> `;
  if(csv)h+=`<button class="ghost" type="button" data-csv="${esc(id)}">Download CSV</button>`;
  h+=`</span></div>`;
  TBL[id]={rows:data,cols};
  return h;
}
function wireTables(root,rerender){
  root.querySelectorAll("table.dt").forEach(t=>{const id=t.dataset.tid;
    t.querySelectorAll("th[data-k]").forEach(th=>{const go=()=>{const T=st.tbl[id];const k=th.dataset.k;T.dir=T.key===k?-T.dir:-1;T.key=k;rerender()};th.addEventListener("click",go);th.addEventListener("keydown",e=>{if(e.key==="Enter")go()})})});
  root.querySelectorAll("[data-more]").forEach(b=>b.addEventListener("click",()=>{st.tbl[b.dataset.more].show+=100;rerender()}));
  root.querySelectorAll("[data-csv]").forEach(b=>b.addEventListener("click",()=>downloadCsv(b.dataset.csv)));
}
function downloadCsv(id){
  const {rows,cols}=TBL[id];const strip=h=>String(h).replace(/<[^>]+>/g," ").replace(/\s+/g," ").trim();
  const q=v=>{v=v==null?"":String(v);return /[",\n]/.test(v)?`"${v.replace(/"/g,'""')}"`:v};
  const val=(c,r)=>c.csv?c.csv(r):c.sort?c.sort(r):r[c.k]!==undefined?r[c.k]:c.fmt?strip(c.fmt(r)):"";
  const lines=[cols.map(c=>q(c.label)).join(",")].concat(rows.map(r=>cols.map(c=>q(val(c,r))).join(",")));
  const blob=new Blob([lines.join("\n")],{type:"text/csv"});const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=`${id}_${D.meta.asof}.csv`;document.body.appendChild(a);a.click();a.remove();
}
const gcap=v=>isNum(v)&&v>=999?"≥999%":sgn(v,0);
const C={
  stock:{k:"s",label:"Stock",l:1,fmt:r=>symBtn(r.s,r.k==="e"&&r.lbl?r.lbl+" · "+r.n:r.n,r.ex),sort:r=>r.s},
  px:{k:"px",label:"Price",fmt:r=>`<span class="num">${inr(r.px)}</span>`},
  ret:p=>({k:"r."+p,label:p,fmt:r=>`<span class="num ${cls(r.r[p])}">${sgn(r.r[p],1)}</span>`,sort:r=>r.r[p]}),
  rs:{k:"rs",label:"RS",fmt:r=>rsPill(r.rs)},
  drs:{k:"drs",label:"RS Δ1W",fmt:r=>{const d=isNum(r.rs)&&isNum(r.rs1w)?r.rs-r.rs1w:null;return `<span class="num ${cls(d)}">${d==null?"–":(d>0?"+":"")+d}</span>`},sort:r=>isNum(r.rs)&&isNum(r.rs1w)?r.rs-r.rs1w:null},
  h52:{k:"h52",label:"From 52W high",fmt:r=>`<span class="num">${sgn(r.h52,1)}</span>`},
  st:{k:"st",label:"Stage",l:1,fmt:r=>stagePill(r.st)},

  fr:{k:"fr",label:"Fund",fmt:r=>rsPill(r.fr)},

/* ════════════════════ ROTATION ════════════════════ */
function groupMap(group){if(group!=="ETFs")return D.groups[group]||{};const E=D.groups.ETFs||{};if(!E[st.etfSet])st.etfSet=Object.keys(E)[0]||"";return E[st.etfSet]||{}}
function groupStats(prev,period=st.period,group=st.group){
  const g=groupMap(group),key=prev?"rp":"r",out=[],minN=group==="ETFs"?1:(D.meta.min_group_size||3);

    const live=syms.filter(s=>D.by[s]);

    if(pairs.length<minN)continue;

      br:a50.length?a50.filter(s=>D.by[s].a50).length/a50.length*100:null,syms:live,top:[...pairs].sort((a,b)=>b[1]-a[1]).slice(0,2)});
  }
  return out;
}
function renderRotation(){

  const ranked=[...now].sort((a,b)=>b.v-a.v);ranked.forEach((g,i)=>g.rank=i+1);
  let rows=ranked;if(st.sort==="name")rows=[...now].sort((a,b)=>a.name.localeCompare(b.name));if(st.sort==="br")rows=[...now].sort((a,b)=>(b.br??-1)-(a.br??-1));

  <div class="card toolbar">
    <div class="ctl"><span>Period</span>${seg("period",PERIODS,st.period,PL)}</div>
    <div class="ctl"><span>Group by</span>${seg("group",Object.keys(D.groups),st.group)}</div>
    ${isE?`<div class="ctl"><span>ETF set</span>${seg("etfSet",Object.keys(D.groups.ETFs||{}),st.etfSet)}</div>`:`<div class="ctl"><span>Average</span>${seg("agg",["mean","median"],st.agg,{mean:"Mean",median:"Median"})}</div>`}
    <div class="ctl"><span>Sort</span>${seg("sort",isE?["ret","name"]:["ret","br","name"],st.sort,{ret:"Return",br:"Breadth",name:"A–Z"})}</div>
    <div class="ctl"><span>View</span>${seg("view",["bars","heat"],st.view,{bars:"Bars",heat:"Heatmap"})}</div>
  </div>`;
  if(!rows.length){$("#view").innerHTML=h+`<div class="card empty">${isE?"No ETF in this set has data for this period.":`No group has ${D.meta.min_group_size}+ stocks with data for this period.`}</div>`;return}
  if(st.view==="heat"){$("#view").innerHTML=h+heatmap(rows);wireTables($("#view"),renderRotation);return}
  const mx=Math.max(1,...now.map(g=>Math.abs(g.v))),showRank=st.period!=="1D";
  h+=`<div class="card rows">`;
  for(const g of rows){
    const w=Math.abs(g.v)/mx*50,left=g.v>=0?50:50-w,pr=prank[g.name],dr=pr?pr-g.rank:0;
    const rk=!showRank||!pr?"<span></span>":dr>0?`<span class="rk gain" title="Rank a week ago: ${pr}">▲${dr}</span>`:dr<0?`<span class="rk loss" title="Rank a week ago: ${pr}">▼${-dr}</span>`:`<span class="rk" title="Rank unchanged">=</span>`;
    const open=st.open===g.name;

      <div class="bname">${esc(g.name)}${isE?"":`<span class="cnt">${g.n}</span><span class="lead">Top: ${g.top.map(([s,v])=>`${esc(s)} ${sgn(v,1)}`).join(" · ")}</span>`}${isE&&D.by[g.syms[0]]?`<span class="lead">RS ${D.by[g.syms[0]].rs??"–"} · ${sgn(D.by[g.syms[0]].h52,1)} from 52W high · ${D.by[g.syms[0]].a50?"above":"below"} 50 DMA</span>`:""}</div>
      <div class="btrack" aria-hidden="true"><div class="zero"></div><div class="fill ${g.v>=0?"pos":"neg"}" style="left:${left}%;width:${w}%"></div></div>
      <div class="bval num ${cls(g.v)}">${sgn(g.v)}</div>${rk}
      ${open?members(g):""}</div>`;

function members(g){

async function etfLoad(){if(ETFD)return ETFD;if(window.EMBED?.etf)return ETFD=window.EMBED.etf;try{const r=await fetch(`data/etf.json?v=${encodeURIComponent(D.meta.generated||"")}`);ETFD=r.ok?await r.json():{}}catch(e){ETFD={}}return ETFD}

function heatmap(rows){
  const stats=Object.fromEntries(PERIODS.map(p=>[p,Object.fromEntries(groupStats(false,p).map(g=>[g.name,g.v]))]));
  const mx=Object.fromEntries(PERIODS.map(p=>[p,Math.max(1,...Object.values(stats[p]).map(Math.abs))]));

  const cell=(v,m)=>{if(!isNum(v))return `<div class="cell">–</div>`;const f=Math.min(1,Math.abs(v)/m),c=v>=0?"var(--up)":"var(--down)";return `<div class="cell num" style="background:color-mix(in srgb,${c} ${Math.round(8+f*62)}%,transparent);${f>.55?"color:#fff":""}">${sgn(v,1)}</div>`};

  for(const g of sorted){h+=`<tr class="hr" data-g="${esc(g.name)}" tabindex="0"><td>${esc(g.name)} <span style="color:var(--muted);font-weight:400;font-size:14px">${g.n}</span></td>${PERIODS.map(p=>`<td>${cell(stats[p][g.name],mx[p])}</td>`).join("")}</tr>`;
    if(st.open===g.name)h+=`<tr><td colspan="${PERIODS.length+1}" style="padding:0 8px 10px;position:static">${members(g)}</td></tr>`}

/* ════════════════════ BREADTH ════════════════════ */
function lineChart(id,series,o){

  const x=i=>pl+i*(W-pl-pr)/(n-1),y=(v,lo,hi)=>pt+(1-(v-lo)/(hi-lo))*(H-pt-pb);
  let g="";
  for(const t of o.ticks)g+=`<line x1="${pl}" x2="${W-pr}" y1="${y(t,o.lo,o.hi)}" y2="${y(t,o.lo,o.hi)}" stroke="var(--track)" stroke-width="${t===o.mid?1.6:1}"/><text x="${pl-8}" y="${y(t,o.lo,o.hi)+4}" text-anchor="end">${t}${o.unit||""}</text>`;
  const step=Math.ceil(n/6);for(let i=0;i<n;i+=step)g+=`<text x="${x(i)}" y="${H-7}" text-anchor="middle">${new Date(D.breadth.dates[i]+"T00:00:00").toLocaleDateString("en-US",{month:"short",year:"2-digit"})}</text>`;
  for(const s of series){const lo=s.lo??o.lo,hi=s.hi??o.hi;
    if(s.bars){const bw=Math.max(1,(W-pl-pr)/n-1),y0=y(0,lo,hi);s.data.forEach((v,i)=>{if(v==null)return;const yy=y(v,lo,hi);g+=`<rect x="${x(i)-bw/2}" y="${Math.min(yy,y0)}" width="${bw}" height="${Math.max(1,Math.abs(yy-y0))}" fill="${v>=0?"var(--up)":"var(--down)"}"/>`});continue}
    const pts=s.data.map((v,i)=>v==null?null:`${x(i).toFixed(1)},${y(v,lo,hi).toFixed(1)}`).filter(Boolean).join(" ");
    g+=`<polyline points="${pts}" fill="none" stroke="${s.c}" stroke-width="${s.w||2}" ${s.dash?'stroke-dasharray="6 5"':""} stroke-linejoin="round"/>`}
  g+=`<line class="xh" x1="0" x2="0" y1="${pt}" y2="${H-pb}" stroke="var(--muted)" stroke-width="1" opacity="0"/>`;
  return `<svg data-chart="${id}" viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="${esc(o.label)}" style="touch-action:pan-y;display:block">${g}<rect x="${pl}" y="0" width="${W-pl-pr}" height="${H}" fill="transparent"/></svg><div class="tip" hidden></div>`;
}
function wireChart(box,id,fmtTip){
  const svg=box.querySelector(`svg[data-chart="${id}"]`),tip=box.querySelector(".tip"),xh=svg.querySelector(".xh"),n=D.breadth.dates.length,W=1000,pl=46,pr=14;
  const move=e=>{const r=svg.getBoundingClientRect(),cx=(e.touches?e.touches[0].clientX:e.clientX)-r.left;
    const i=Math.max(0,Math.min(n-1,Math.round((cx/r.width*W-pl)/((W-pl-pr)/(n-1))))),sx=pl+i*(W-pl-pr)/(n-1);

    const bx=box.getBoundingClientRect(),tw=tip.offsetWidth;let left=sx/W*r.width+(r.left-bx.left)+12;if(left+tw>bx.width-8)left-=tw+24;tip.style.left=Math.max(4,left)+"px";tip.style.top="48px"};
  const out=()=>{tip.hidden=true;xh.setAttribute("opacity","0")};
  svg.addEventListener("mousemove",move);svg.addEventListener("touchmove",move,{passive:true});svg.addEventListener("touchstart",move,{passive:true});svg.addEventListener("mouseleave",out);svg.addEventListener("touchend",out);
}

function fmtMetric(m,v){if(!isNum(v))return "–";return m.fmt==="pct"?(v>=999?"≥999%":sgn(v,1)):m.fmt==="x"?v.toFixed(1)+"×":m.fmt==="int"?v.toFixed(0):v.toFixed(Math.abs(v)<100?1:0)}
const scanViewSeg=()=>`<div class="subtabs">${seg("scanView",["lib","s2"],st.scanView,{lib:"Scanner library",s2:"Stage 2: early · mid · late"})}</div>`;
function renderScanners(){
  if(st.scanView==="s2"){renderStage2(scanViewSeg());return}
  const S=D.scans;if(!S?.meta){$("#view").innerHTML=`<div class="err">Scanner data is in an older format. Run “Daily update” once.</div>`;return}
  if(!D.scanMeta[st.scan])st.scan=S.meta[0].id;
  const m=D.scanMeta[st.scan],hits=S.hits[m.id]||[];
  const rail=S.cats.map(c=>`<h4>${esc(c)}</h4>`+S.meta.filter(x=>x.cat===c).map(x=>{const n=(S.hits[x.id]||[]).length;return `<button type="button" data-scan="${x.id}" aria-current="${x.id===m.id}"><span>${esc(x.name)}</span><span class="c ${n?"":"z"}">${n}</span></button>`}).join("")).join("");
  const pick=`<select class="select" id="scanSel" style="width:100%" aria-label="Choose a scanner">${S.cats.map(c=>`<optgroup label="${esc(c)}">${S.meta.filter(x=>x.cat===c).map(x=>`<option value="${x.id}" ${x.id===m.id?"selected":""}>${esc(x.name)} (${(S.hits[x.id]||[]).length})</option>`).join("")}</optgroup>`).join("")}</select>`;
  let rows=hits.map(s=>D.by[s]).filter(Boolean);const metric=S.metric?.[m.id]||{};
  let topNote="";
  if(st.scanFund&&m.cat!=="ETFs"){const before=rows.length;rows=rows.filter(r=>(r.fr??0)>=st.scanFund);topNote=`${rows.length} of ${before} stocks have a Fund rating of ${st.scanFund}+. `}
  if(st.scanTop&&m.cat!=="ETFs"){const top=new Set(groupStats(false,st.period,"Themes").sort((a,b)=>b.v-a.v).slice(0,st.scanTop).map(g=>g.name));
    const before=rows.length;rows=rows.filter(r=>(D.themesOf[r.s]||[]).some(t=>top.has(t)));
    topNote+=`${rows.length} of ${before} stocks are in the top ${st.scanTop} themes by ${PL[st.period]||st.period} return: ${[...top].join(", ")}.`}
  const isEtfScan=m.cat==="ETFs";
  const cols=isEtfScan?[C.stock,C.px,C.ret("1D")]:[C.stock,C.px,C.mc,C.ret("1D")];
  const DUP={"Day %":"r.1D","Vol ×":"vr","From 52wH %":"h52","Close range %":"dcr","ADR %":"adr","Profit YoY %":"pat_yoy","P/E":"pe","RS":"rs"},dup=DUP[m.metric];
  if(m.metric&&!dup)cols.push({k:"metric",label:m.metric,fmt:r=>`<span class="num">${fmtMetric(m,metric[r.s])}</span>`,sort:r=>metric[r.s]});
  const FCATS=["Earnings & growth","Quality & value","Ownership & insiders","Fundamental red flags"];
  if(m.cat==="ETFs")cols.push(C.ret("1W"),C.ret("1M"),C.ret("3M"),C.vr,C.rs,C.h52,C.st,C.sec);
  else if(FCATS.includes(m.cat))cols.push(C.patg,C.revg,C.pe,C.roe,C.rs,C.fr,C.ret("1M"),C.h52,C.st,C.sec,C.themes);
  else cols.push(C.ret("1M"),C.vr,C.dcr,C.adr,C.rs,C.fr,C.h52,C.st,C.sec,C.themes);
  const tid="scan_"+m.id,mk=dup||"metric";
  if(!st.tbl[tid])st.tbl[tid]={key:m.sort==="metric"||m.sort==="metric_asc"?mk:"rs",dir:m.sort==="metric_asc"?1:-1,show:100};
  $("#view").innerHTML=scanViewSeg()+`<div class="sec-head"><div><h2>Scanner library</h2><p>${S.meta.length} scans run on every stock after the close${D.meta.fund?` — ${S.meta.filter(x=>!x.id.startsWith("f_")).length} technical and ${S.meta.filter(x=>x.id.startsWith("f_")).length} fundamental (from SEC filings)`:""}. Tap any stock for its detail card, including every other scan it appears in.</p></div></div>
  <div class="scan-pick">${pick}</div>
  <div class="scan-layout"><nav class="card rail" aria-label="Scanners">${rail}</nav>
  <section class="card"><div class="scan-head"><h3>${esc(m.name)}<span class="cnt num">${hits.length}</span></h3><p>${esc(m.desc)}</p><div class="catchips"><span class="pill p-acc">${esc(m.cat)}</span>${rows.length?`<button type="button" class="ghost" data-wl-addall="${esc(JSON.stringify(rows.map(r=>r.s)))}" data-label="${esc(m.name)} stocks" style="margin-left:6px">☆ Add all ${rows.length} to a watchlist</button>`:""}</div>
  ${isEtfScan?"":`<div style="display:flex;flex-wrap:wrap;gap:12px 22px;margin-top:12px"><div class="ctl"><span>Stocks shown</span>${seg("scanTop",["0","5","10"],String(st.scanTop),{"0":"All","5":"Top 5 themes","10":"Top 10 themes"})}</div>
  ${D.meta.fund?`<div class="ctl"><span>Fundamentals</span>${seg("scanFund",["0","60","80"],String(st.scanFund),{"0":"Any","60":"Fund 60+","80":"Fund 80+"})}</div>`:""}</div>${topNote?`<p class="note" style="margin:8px 0 0">${esc(topNote)}</p>`:""}`}</div>
  <div id="scanT">${dtable(tid,rows,cols,{empty:"No stocks triggered this scan today."})}</div></section></div>`;
  wireTables($("#scanT"),renderScanners);
  $("#scanSel").addEventListener("change",e=>{st.scan=e.target.value;store.set("scan2",st.scan);renderScanners()});
}

/* ════════════════════ LONG BASES ════════════════════
   bases.json (scripts/bases.py): one row per stock = its longest daily base.
   len = trading days in the base, piv = pivot (highest close inside it), fl = lowest close,
   st = status vs the pivot, ib = a breakout from a shorter base inside it (last 20 sessions). */
let BASES=null;
async function basesLoad(){
  if(!BASES){if(window.EMBED?.bases)BASES=window.EMBED.bases;
    else{if(!D.meta.bases)return null;try{const r=await fetch(`data/bases.json?v=${Date.now()}`);BASES=r.ok?await r.json():null}catch(e){BASES=null}}
    if(BASES)BASES.by=Object.fromEntries(BASES.rows.map(x=>[x.s,x]))}
  return BASES}
const bdur=n=>n>=250?`${(n/250).toFixed(1)} yrs`:n>=42?`${Math.round(n/21)} months`:`${Math.round(n/5)} weeks`;
const bmon=d=>{const t=new Date(String(d).slice(0,10)+"T00:00:00");return isNaN(t)?"":t.toLocaleDateString("en-US",{month:"short",year:"numeric"})};
const bFromPiv=b=>b.st==="bo0"||b.st==="bo"||b.st==="ext"?b.ext:isNum(b.dist)?(1/(1+b.dist/100)-1)*100:null;  // price vs pivot, %
const BST={bo0:["Breakout today","p-up"],bo:["Breakout","p-up"],tb:["Back at the pivot","p-acc"],ext:["Extended","p-acc"],near:["Near pivot","p-acc"],w15:["5–15% below","p-mut"],in:["In base","p-mut"]};
const BORDER={bo0:0,bo:1,near:2,ext:3,w15:4,in:5};
function bStatus(b,long){
  const tb=b.st==="bo"&&b.ext<0,[lab,c]=BST[tb?"tb":b.st]||["–","p-mut"],fp=bFromPiv(b);
  let h=`<span class="pill ${c}">${esc(tb?lab:b.st==="bo"?`Breakout ${b.ago}d ago`:lab)}</span>`;
  if(tb)h+=`<span class="bsub">Broke out ${b.ago}d ago, now testing the pivot from above (throwback)</span>`;
  if(long)h+=` <span class="num" style="font-weight:700">${b.st==="bo0"||b.st==="bo"||b.st==="ext"?sgn(b.ext,1)+" above pivot":sgn(fp,1)+" from pivot"}</span>`;
  if(b.ib)h+=`<span class="bsub">${b.ib.ago===0?"Today":b.ib.ago+"d ago"}: broke out of a ${b.ib.len}-day base inside it ($${inr(b.ib.piv)})</span>`;
  return h}
const bInner=b=>b.ib&&b.ib.len>=100&&b.ib.ext<=5;   // a long-base breakout inside an even longer base
function scorePill(v){if(!isNum(v))return "–";const c=v>=80?"rs-a":v>=70?"rs-b":v>=55?"rs-c":"rs-d";return `<span class="rs ${c}">${v}</span>`}
function bchart(s,big,wpx){
  const ch=BASES?.charts?.[s],b=BASES?.by?.[s];if(!ch||!b)return "–";
  const c=ch.c,n=c.length;if(n<3)return "–";
  const W=big?Math.max(320,Math.min(900,(wpx||460)-12)):156,H=big?Math.round(Math.min(300,Math.max(220,W*.45))):48,pl=big?58:2,pr=big?8:2,pt=big?14:4,pb=big?28:4;
  const v=c.filter(isNum);let lo=Math.min(...v,b.fl),hi=Math.max(...v,b.piv);if(isNum(b.tgt)&&big&&b.tgt<hi*1.25)hi=Math.max(hi,b.tgt);const pad=(hi-lo)*.07;lo-=pad;hi+=pad;
  const x=i=>pl+i*(W-pl-pr)/(n-1),y=t=>pt+(1-(t-lo)/(hi-lo))*(H-pt-pb);
  const e=ch.b!=null?ch.b-1:n-1;
  let g="";
  if(big){for(let k=0;k<=3;k++){const t=lo+(hi-lo)*k/3;g+=`<line x1="${pl}" x2="${W-pr}" y1="${y(t)}" y2="${y(t)}" stroke="var(--track)"/><text x="${pl-8}" y="${y(t)+4}" text-anchor="end">${t>=1000?Math.round(t).toLocaleString("en-US"):t.toFixed(t>=100?0:1)}</text>`}
    g+=`<text x="${x(ch.s)}" y="${H-8}" text-anchor="${ch.s<n*.15?"start":"middle"}">${esc(bmon(b.start))}</text><text x="${W-pr}" y="${H-8}" text-anchor="end">${esc(fmtDate(D.meta.asof))}</text>`}
  g+=`<rect class="box" x="${x(ch.s)}" y="${y(b.piv)}" width="${Math.max(1,x(e)-x(ch.s))}" height="${Math.max(1,y(b.fl)-y(b.piv))}"/>`;
  if(ch.ibp!=null&&ch.ibs!=null)g+=`<line x1="${x(ch.ibs)}" x2="${x(ch.ib)}" y1="${y(ch.ibp)}" y2="${y(ch.ibp)}" stroke="var(--s2)" stroke-width="${big?1.8:1.3}"/>`;
  g+=`<line x1="${x(ch.s)}" x2="${W-pr}" y1="${y(b.piv)}" y2="${y(b.piv)}" stroke="var(--accent-ink)" stroke-width="${big?2:1.5}" stroke-dasharray="${big?"7 4":"4 3"}"/>`;
  if(big){g+=`<text x="${pl+6}" y="${y(b.piv)-6}" style="fill:var(--accent-ink);font-weight:700">Pivot ${inr(b.piv)}</text><text x="${pl+6}" y="${y(b.fl)+17}" style="font-weight:700">Base low ${inr(b.fl)}</text>`;
    if(isNum(b.tgt)&&b.tgt<=hi)g+=`<line x1="${pl}" x2="${W-pr}" y1="${y(b.tgt)}" y2="${y(b.tgt)}" stroke="var(--muted)" stroke-width="1.4" stroke-dasharray="2 4"/><text x="${W-pr-4}" y="${y(b.tgt)-6}" text-anchor="end">Measured move ${inr(b.tgt)}</text>`}
  g+=`<polyline points="${c.map((t,i)=>isNum(t)?`${x(i).toFixed(1)},${y(t).toFixed(1)}`:null).filter(Boolean).join(" ")}" fill="none" stroke="var(--s1)" stroke-width="${big?2:1.5}" stroke-linejoin="round"/>`;
  if(ch.b!=null)g+=`<circle cx="${x(ch.b)}" cy="${y(c[ch.b])}" r="${big?5.5:3.2}" fill="var(--up)" stroke="var(--card)" stroke-width="2"/>`;
  else if(ch.ib!=null)g+=`<circle cx="${x(ch.ib)}" cy="${y(c[ch.ib])}" r="${big?5:3}" fill="var(--s2)" stroke="var(--card)" stroke-width="2"/>`;
  return `<svg class="bch${big?" big":""}" viewBox="0 0 ${W} ${H}" ${big?'style="width:100%;height:auto"':`width="${W}" height="${H}"`} role="img" aria-label="${esc(s)}: ${b.len}-day base since ${esc(bmon(b.start))}, pivot ${inr(b.piv)}, low ${inr(b.fl)}">${g}</svg>`}
function bJoin(b){const x=D.by[b.s]||{};return {s:b.s,n:x.n,rs:x.rs,fr:x.fr,mc:x.mc,sec:x.sec,ind:x.ind,stage:x.st,px:x.px,b}}
const BCOL={
  len:{k:"len",label:"Base days",fmt:r=>`<span class="bdays num">${r.b.len.toLocaleString("en-US")}${r.b.cap?"+":""}</span><span class="bsub">${bdur(r.b.len)} · from ${esc(bmon(r.b.start))}${r.b.lst?" (listing)":""}${r.b.cap?" (data limit)":""}</span>`,sort:r=>r.b.len,csv:r=>r.b.len},
  ch:{k:"ch",label:"Base (shaded) and pivot",l:1,fmt:r=>bchart(r.s),sort:r=>r.b.len,csv:r=>r.b.start},
  st:{k:"bst",label:"Status",l:1,fmt:r=>bStatus(r.b),sort:r=>BORDER[r.b.st]*1000-(r.b.len/10),csv:r=>(BST[r.b.st]||[""])[0]+(r.b.ib?` / inner breakout ${r.b.ib.len}d`:"")},
  fp:{k:"fp",label:"From pivot",fmt:r=>{const v=bFromPiv(r.b);return `<span class="num ${v>=0?"up":""}" style="font-weight:700">${sgn(v,1)}</span>`},sort:r=>bFromPiv(r.b)},
  piv:{k:"piv",label:"Pivot $",fmt:r=>`<span class="num">${inr(r.b.piv)}</span>`,sort:r=>r.b.piv},
  depth:{k:"depth",label:"Depth %",fmt:r=>`<span class="num">${isNum(r.b.depth)?r.b.depth.toFixed(0):"–"}</span>`,sort:r=>r.b.depth},
  sc:{k:"sc",label:"Base Score",fmt:r=>scorePill(r.b.sc),sort:r=>r.b.sc},
  type:{k:"type",label:"Built after",l:1,fmt:r=>r.b.type==="C"?"an advance":`a decline`,sort:r=>r.b.type},
  tc:{k:"tc",label:"Pivot tests",fmt:r=>`<span class="num">${r.b.tc}</span>`,sort:r=>r.b.tc},
  tight:{k:"tight",label:"Last 15d range %",fmt:r=>`<span class="num">${isNum(r.b.tight)?r.b.tight.toFixed(1):"–"}</span>`,sort:r=>r.b.tight},
  dry:{k:"dry",label:"Vol 10d ÷ base",fmt:r=>`<span class="num">${isNum(r.b.dry)?r.b.dry.toFixed(2):"–"}</span>`,sort:r=>r.b.dry},
  tgt:{k:"tgt",label:"Measured move $",fmt:r=>`<span class="num">${inr(r.b.tgt)}</span> <span class="bsub" style="display:inline">${isNum(r.b.tgt)&&isNum(r.px)?sgn((r.b.tgt/r.px-1)*100,0):""}</span>`,sort:r=>isNum(r.b.tgt)&&isNum(r.px)?r.b.tgt/r.px:null,csv:r=>r.b.tgt},
};
if(!st.bx)st.bx={q:"",status:"act",min:"100",depth:"0",score:"0",type:"all",s2:false,rs70:false,f60:false};
function bFilter(rows){
  const f=st.bx,q=f.q.trim().toUpperCase(),min=+f.min,dep=+f.depth,sc=+f.score;
  return rows.filter(b=>{const x=D.by[b.s]||{};
    if(q&&!b.s.includes(q)&&!String(x.n||"").toUpperCase().includes(q))return false;
    if(f.status==="act"&&!["bo0","bo","near","w15"].includes(b.st))return false;
    if(f.status==="bo"&&!(["bo0","bo","ext"].includes(b.st)||bInner(b)))return false;
    if(["near","w15","in"].includes(f.status)&&b.st!==f.status)return false;
    if(b.len<min)return false;if(dep&&!(b.depth<=dep))return false;if(sc&&!(b.sc>=sc))return false;
    if(f.type!=="all"&&b.type!==f.type)return false;
    if(f.s2&&x.st!==2)return false;if(f.rs70&&!((x.rs??0)>=70))return false;if(f.f60&&!((x.fr??0)>=60))return false;
    return true})}
function bEvidence(E){
  if(!E)return "";
  const bar=(v,mx)=>`<span class="ebar" style="width:${Math.max(2,Math.round(Math.max(0,v)/mx*110))}px"></span><span class="num" style="font-weight:700">${sgn(v,1)}</span>`;
  const mx=Math.max(...E.len_quality.map(r=>r.avg),...E.len_other.map(r=>r.avg),...E.score_all.map(r=>r.avg),1);
  const oth=Object.fromEntries(E.len_other.map(r=>[r.label,r]));
  const t1=`<div class="tscroll"><table class="dt etab"><thead><tr><th class="l">Base length (trading days)</th><th class="l">Avg 1 yr vs ${esc(benchName())}</th><th>Median</th><th>Beat the index</th><th>Failed</th><th>Doubled</th><th>Breakouts</th><th class="l">Not in an uptrend: avg</th><th>Beat</th></tr></thead><tbody>`+
    E.len_quality.map(r=>{const o=oth[r.label]||{};return `<tr><td class="l"><b>${esc(r.label)}</b></td><td class="l">${bar(r.avg,mx)}</td><td class="num">${sgn(r.med,1)}</td><td class="num">${r.win.toFixed(0)}%</td><td class="num">${r.fail.toFixed(0)}%</td><td class="num">${r.big.toFixed(0)}%</td><td class="num">${r.n.toLocaleString("en-US")}</td><td class="l">${bar(o.avg,mx)}</td><td class="num">${isNum(o.win)?o.win.toFixed(0)+"%":"–"}</td></tr>`}).join("")+`</tbody></table></div>`;
  const late=Object.fromEntries(E.score_late.map(r=>[r.label,r])),all=Object.fromEntries(E.score_all.map(r=>[r.label,r]));
  const t2=`<div class="tscroll"><table class="dt etab"><thead><tr><th class="l">Base Score</th><th class="l">Avg 1 yr vs ${esc(benchName())}, ${esc(E.p1||"2007–16")}</th><th class="l">Same, ${esc(E.p2||"2017–26")}</th><th>Median</th><th>Beat the index</th><th>Failed</th><th>Breakouts</th></tr></thead><tbody>`+
    E.score_early.map(r=>{const l=late[r.label]||{},a=all[r.label]||{};return `<tr><td class="l"><b>${esc(r.label)}</b></td><td class="l">${bar(r.avg,mx)}</td><td class="l">${bar(l.avg,mx)}</td><td class="num">${sgn(a.med,1)}</td><td class="num">${a.win.toFixed(0)}%</td><td class="num">${a.fail.toFixed(0)}%</td><td class="num">${a.n.toLocaleString("en-US")}</td></tr>`}).join("")+`</tbody></table></div>`;
  return `<details class="card evid"${store.get("bxEv",false)?" open":""}><summary>${esc(E.title)} <span>— does a longer base mean a bigger move?</span></summary><div class="evb">
    <ul class="fl">${E.findings.map(t=>`<li>${esc(t)}</li>`).join("")}</ul>
    <h4>Breakouts in an uptrend (above a rising 150-day and the 200-day average) with RS 70+, by base length</h4>${t1}
    <h4>All breakouts, by Base Score at the breakout</h4>${t2}
    <p class="note">${esc(E.data)} ${esc(E.caveats)}</p>
    <p class="note"><b>Base Score (0–100):</b> base length 25 (most for 200–399 days, then 400–799) · RS rating 25 · uptrend 20 (above a rising 150-day and the 200-day average) · tight right side 15 (last 15 sessions within 6%) · built after an advance 10 · little overhead supply 5. <b>Rules:</b> a base is the time a stock has spent below a closing high (the pivot) without falling more than 50% below it; it starts at the left-side high after an advance, or at the bar after the last close above the pivot if the stock fell into it. Breakout = close above the pivot; buy range = up to 5% above it (O'Neil). Measured move = pivot + 85% of the base height (Bulkowski).</p></div></details>`}
async function renderBases(){
  $("#view").innerHTML=`<div class="empty">Loading bases…</div>`;
  const B=await basesLoad();if(st.tab!=="bases")return;
  if(!B){$("#view").innerHTML=`<div class="err">Base data isn't there yet. It is made by the evening “Daily update” run — run it once from the Actions tab, then reload.</div>`;return}
  const f=st.bx,R=B.rows,n200=R.filter(b=>b.len>=200).length,near=R.filter(b=>b.st==="near"),bo=R.filter(b=>["bo0","bo"].includes(b.st)||bInner(b)),top=R.filter(b=>b.sc>=70&&b.len>=200);
  const tile=(id,k,v,d)=>`<button type="button" class="card tile btile" data-bpreset="${id}"><div class="k">${k}</div><div class="v num">${v.toLocaleString("en-US")}</div><div class="d">${d}</div></button>`;
  $("#view").innerHTML=`<div class="sec-head"><div><h2>Long-base identifier</h2><p>Every stock in a base on the daily chart, ranked by how many trading days it has spent there. A base is the time a stock has spent below a closing high (its pivot) without falling more than 50% below it — Weinstein's Stage 1, O'Neil's cups and flat bases, Wyckoff ranges. Tested on 20 years of US data below.</p></div></div>
  <div class="tiles btiles">${tile("big","Bases of 200+ days",n200,`of ${R.length.toLocaleString("en-US")} stocks in a base`)}${tile("near","Within 5% of the pivot",near.length,`${near.filter(b=>b.len>=200).length} of them in 200+ day bases`)}${tile("bo","Breakouts, last 20 days",bo.length,"still within 5% of the pivot")}${tile("top","Base Score 70+, 200+ days",top.length,"the best-scoring long bases")}</div>
  ${bEvidence(B.evidence)}
  <div class="card toolbar">
    <div class="ctl"><span>Search</span><input class="search" type="search" id="bq" placeholder="Symbol or company" value="${esc(f.q)}" aria-label="Search bases"></div>
    <div class="ctl"><span>Where price is</span>${seg("b_status",["act","bo","near","w15","in","all"],f.status,{act:"Breakouts + within 15%",bo:"Breakouts",near:"Within 5%",w15:"5–15% below",in:"15%+ below",all:"All"})}</div>
    <div class="ctl"><span>Base at least</span>${seg("b_min",["25","100","200","400","800"],f.min,{"25":"25 days","100":"100 (~5 mo)","200":"200 (~10 mo)","400":"400 (~1.6 yr)","800":"800 (~3 yr)"})}</div>
    <div class="ctl"><span>Depth</span>${seg("b_depth",["0","15","33"],f.depth,{"0":"Any (≤50%)","15":"Flat ≤15%","33":"≤33%"})}</div>
    <div class="ctl"><span>Base Score</span>${seg("b_score",["0","55","70","80"],f.score,{"0":"Any","55":"55+","70":"70+","80":"80+"})}</div>
    <div class="ctl"><span>Built after</span>${seg("b_type",["all","C","S"],f.type,{all:"Either",C:"An advance",S:"A decline"})}</div>

function clIdx(date){if(!CL||!CL.dates.length)return -1;const d=CL.dates;if(date>=d[d.length-1])return d.length-1;if(date<d[0])return -1;
  let lo=0,hi=d.length-1;while(lo<hi){const m=(lo+hi+1)>>1;if(d[m]<=date)lo=m;else hi=m-1}return lo}
