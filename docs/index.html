/* ── per-stock numbers ── */
function itemStats(it){
  const s=it.s,x=D.by[s],px=pxOf(s),bn=benchPx(),m=wlGet().meta[s]||{};
  const o={since:isNum(px)&&isNum(it.p)&&it.p>0?(px/it.p-1)*100:null};
  o.bret=isNum(bn)&&isNum(it.b)&&it.b>0?(bn/it.b-1)*100:null;
  o.alpha=isNum(o.since)&&isNum(o.bret)?o.since-o.bret:null;
  o.days=Math.max(0,Math.round((new Date(D.meta.asof+"T00:00:00")-new Date(it.d+"T00:00:00"))/864e5));
  const c=CL?.c?.[s];
  if(c&&isNum(it.p)){const i0=Math.max(0,clIdx(it.d));const seg=c.slice(i0).filter(isNum);if(seg.length){o.maxg=(Math.max(...seg)/it.p-1)*100;o.maxdd=(Math.min(...seg)/it.p-1)*100}}
  if(isNum(px)){
    if(isNum(m.pivot)&&m.pivot>0)o.fromPiv=(px/m.pivot-1)*100;
    if(isNum(m.stop)&&m.stop>0)o.toStop=(px/m.stop-1)*100;
    if(isNum(m.target)&&m.target>0)o.toTgt=(m.target/px-1)*100;
  }
  o.setup=setupOf(px,m,o);
  return o;
}
function setupOf(px,m,o){
  if(isNum(o.toStop)&&o.toStop<0)return{k:"stop",t:"Below stop"};
  if(isNum(o.toTgt)&&o.toTgt<=0)return{k:"tgt",t:"Target hit"};
  if(!isNum(o.fromPiv))return null;
  if(o.fromPiv<-3)return{k:"below",t:`${Math.abs(o.fromPiv).toFixed(1)}% below pivot`};
  if(o.fromPiv<0)return{k:"near",t:`Near pivot (${o.fromPiv.toFixed(1)}%)`};
  if(o.fromPiv<=5)return{k:"zone",t:`Buy zone +${o.fromPiv.toFixed(1)}%`};
  return{k:"ext",t:`Extended +${o.fromPiv.toFixed(1)}%`};
}
const setupPill=u=>u?`<span class="setup ${u.k}">${esc(u.t)}</span>`:`<span style="color:var(--muted)">–</span>`;
function spark(s,added){const c=CL?.c?.[s];if(!c)return `<span style="color:var(--muted)">–</span>`;
  const n=63,a=c.slice(-n),v=a.filter(isNum);if(v.length<5)return "–";const lo=Math.min(...v),hi=Math.max(...v),W=104,H=30;
  const x=i=>2+i*(W-4)/(a.length-1),y=t=>H-3-(t-lo)/((hi-lo)||1)*(H-6);
  const pts=a.map((t,i)=>isNum(t)?`${x(i).toFixed(1)},${y(t).toFixed(1)}`:null).filter(Boolean).join(" ");
  const up=v[v.length-1]>=v[0];let dot="";
  if(added){const ia=clIdx(added)-(c.length-a.length);if(ia>=0&&isNum(a[ia]))dot=`<circle cx="${x(ia).toFixed(1)}" cy="${y(a[ia]).toFixed(1)}" r="3.2" fill="var(--card)" stroke="var(--ink)" stroke-width="1.6"/>`}
  return `<svg class="spark" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="${s} last 3 months ${up?"up":"down"}"><polyline points="${pts}" fill="none" stroke="${up?"var(--up)":"var(--down)"}" stroke-width="2" stroke-linejoin="round"/>${dot}</svg>`}

/* ── alerts: what needs attention today ── */
const BULL_SCANS=["combo3","up4","high52_dcr","ath","vcp","pocket_pivot","tight3w","power3","bgu","episodic_pivot","darvas","stage2_bo","bull_snort","wedge_pop","f_post","f_accel","lb_breakout","lb_near","s2_early"];
const BEAR_SCANS=["down4","leader_down","below200","ema_down","death","gap_down","f_red"];
function sma50(c,i){if(!c||i<49)return null;let t=0;for(let k=i-49;k<=i;k++){if(!isNum(c[k]))return null;t+=c[k]}return t/50}
function wlAlerts(syms){
  const out=[],w=wlGet(),asof=D.meta.asof;
  for(const s of syms){
    const x=D.by[s],px=pxOf(s),m=w.meta[s]||{},lists=wlListsOf(s).map(l=>l.name).join(", ");
    const add=(lvl,txt,rank)=>out.push({s,lvl,txt,rank,lists});
    const prev=x&&isNum(x.r?.["1D"])?px/(1+x.r["1D"]/100):null;
    if(isNum(px)&&isNum(m.stop)){if(px<m.stop)add("crit",isNum(prev)&&prev>=m.stop?`Closed below your stop $${inr(m.stop)} today`:`Below your stop $${inr(m.stop)} (${((px/m.stop-1)*100).toFixed(1)}%)`,0);
      else if(px/m.stop-1<=.03)add("warn",`Within ${((px/m.stop-1)*100).toFixed(1)}% of your stop $${inr(m.stop)}`,2)}
    if(isNum(px)&&isNum(m.target)&&px>=m.target)add("good",`Reached your target $${inr(m.target)}`,3);
    if(isNum(px)&&isNum(m.pivot)){const fp=(px/m.pivot-1)*100;
      if(isNum(prev)&&prev<=m.pivot&&px>m.pivot)add("good",`Broke out above your pivot $${inr(m.pivot)}${isNum(x?.vr)?` on ${x.vr.toFixed(1)}× volume`:""}`,1);
      else if(fp>=0&&fp<=5)add("good",`In the buy zone, +${fp.toFixed(1)}% above pivot $${inr(m.pivot)}`,4);
      else if(fp<0&&fp>=-3)add("info",`${Math.abs(fp).toFixed(1)}% below your pivot $${inr(m.pivot)} — get ready`,5)}
    const bad=(D.scansOf[s]||[]).filter(id=>BEAR_SCANS.includes(id)).map(id=>D.scanMeta[id]?.name).filter(Boolean);
    if(bad.length)add("warn",`Warning: ${bad.join(", ")}`,2);
    const good=(D.scansOf[s]||[]).filter(id=>BULL_SCANS.includes(id)).map(id=>D.scanMeta[id]?.name).filter(Boolean);
    if(good.length)add("good",`In today's scans: ${good.join(", ")}`,6);
    if(x&&isNum(x.rs)&&isNum(x.rs1w)&&x.rs<70&&x.rs1w>=70)add("warn",`RS rating fell to ${x.rs} (was ${x.rs1w} a week ago)`,7);
    const c=CL?.c?.[s];if(c&&c.length>51){const i=c.length-1,a=sma50(c,i),b=sma50(c,i-1);
      if(isNum(a)&&isNum(b)&&c[i]<a&&c[i-1]>=b)add("warn","Closed below its 50-day average today",3);
      if(isNum(a)&&isNum(b)&&c[i]>a&&c[i-1]<=b)add("info","Closed back above its 50-day average",8)}
    if(x?.next_results){const dd=Math.round((new Date(x.next_results+"T00:00:00")-new Date(asof+"T00:00:00"))/864e5);
      if(dd>=0&&dd<=7)add("info",`Earnings on ${new Date(x.next_results+"T00:00:00").toLocaleDateString("en-US",{weekday:"short",day:"numeric",month:"short"})}${x.next_est?" (estimated)":""} (${dd===0?"today":dd===1?"tomorrow":"in "+dd+" days"}) — decide before, not after`,9)}
    const v=VPX?.[s];if(v&&/FRESH/.test(v.status||""))add("good","Fresh VPCI buy signal this week",6);
  }
  const ord={crit:0,warn:1,good:2,info:3};
  return out.sort((a,b)=>ord[a.lvl]-ord[b.lvl]||a.rank-b.rank||a.s.localeCompare(b.s));
}

function parseSyms(text){const known=s=>D.by[s]||VPX?.[s];const ok=[],bad=[];
  for(let t of String(text).toUpperCase().split(/[\s,;|]+/)){t=t.replace(/^(NASDAQ|NYSE|AMEX|ARCA|NYSEARCA|BATS|CBOE|OTC)[:_]/,"").replace(/^#+/,"").replace(/-(?=[A-Z]$)/,".").trim();if(!t||t.startsWith("###"))continue;
    (known(t)?ok:bad).push(t)}return{ok:[...new Set(ok)],bad:[...new Set(bad)]}}
function dl(name,text,type="text/plain"){const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;document.body.appendChild(a);a.click();a.remove()}
function wlImportDialog(){const w=wlGet();
  modal(`<form><h3>Import stocks</h3><p>Paste symbols separated by commas, spaces or new lines — <code>NASDAQ:</code>/<code>NYSE:</code> prefixes and TradingView list files are fine. Or load a TradingView <code>.txt</code> or a backup <code>.json</code>.</p>
    <textarea name="t" rows="6" placeholder="NVDA, CELH, NASDAQ:AAPL, XLK"></textarea>
    <div class="wlf" style="margin-top:10px"><div class="g3"><label class="f">Into list<select name="l">${w.lists.map(l=>`<option value="${l.id}" ${l.id===w.active?"selected":""}>${esc(l.name)}</option>`).join("")}<option value="__new">+ New list…</option></select></label>
    <label class="f">New list name<input name="nn" placeholder="Only for a new list" maxlength="40"></label>
    <label class="f">Added on<input type="date" name="d" value="${D.meta.asof}" max="${D.meta.asof}"></label></div>
    <label class="f">Or load a file<input type="file" name="f" accept=".txt,.csv,.json"></label></div>
    <p class="err" id="imperr" hidden></p>
    <div class="acts"><button type="button" class="ghost" data-mclose>Cancel</button><button class="btn" type="submit">Import</button></div></form>`,
  async(fd,form)=>{let text=String(fd.get("t")||"");const file=fd.get("f");
    if(file&&file.size){const ft=await file.text();if(/\.json$/i.test(file.name)){try{const j=JSON.parse(ft);if(!Array.isArray(j.lists))throw 0;
        if(!confirm(`Replace all your watchlists with the backup (${j.lists.length} lists)?`))return false;WL=wlNorm(j);wlSave();renderWatch();toast("Backup restored");return}catch(e){$("#imperr").hidden=false;$("#imperr").textContent="That file isn't a watchlist backup.";return false}}
      text+="\n"+ft}
    await vpxLoad();const {ok,bad}=parseSyms(text);if(!ok.length){$("#imperr").hidden=false;$("#imperr").textContent=bad.length?`None of these are known symbols: ${bad.slice(0,12).join(", ")}`:"Nothing to import.";return false}
    let lid=fd.get("l");if(lid==="__new"){const n=String(fd.get("nn")||"").trim()||"Imported";lid=wlNewId();w.lists.push({id:lid,name:n,items:[]})}
    const d=String(fd.get("d")||D.meta.asof);await clLoad();let n=0;
    for(const s of ok){let o={d};if(d<D.meta.asof){const i=clIdx(d),c=CL.c[s],bc=CL.c[benchName()];if(i>=0&&c&&isNum(c[i]))o.p=c[i];if(i>=0&&bc&&isNum(bc[i]))o.b=bc[i]}
      if(wlAdd(lid,s,o))n++}
    w.active=lid;wlSave();renderWatch();toast(`${n} added${bad.length?` · ${bad.length} not recognised: ${bad.slice(0,5).join(", ")}${bad.length>5?"…":""}`:""}`)})}
function wlExportTV(){const w=wlGet(),L=wlList(w.active);const syms=L.items.map(i=>{const e=exOf(i.s);return TVX.has(e)?`${e}:${i.s}`:i.s});dl(`${L.name.replace(/[^\w-]+/g,"_")}.txt`,syms.join(","));toast("TradingView list downloaded — import it from the watchlist menu in TradingView")}
function wlShareLink(){const L=wlList(wlGet().active);const url=`${location.origin}${location.pathname}#wl=${encodeURIComponent(L.name)}:${L.items.map(i=>i.s).join(",")}`;
  (navigator.clipboard?.writeText(url)||Promise.reject()).then(()=>toast("Share link copied"),()=>modal(`<h3>Share link</h3><p>Copy this link:</p><textarea rows="4" readonly>${esc(url)}</textarea><div class="acts"><button class="btn" data-mclose>Done</button></div>`))}
function wlCheckShared(){const h=decodeURIComponent(location.hash||"");const m=h.match(/^#wl=([^:]*):(.*)$/);if(!m)return false;
  const name=m[1]||"Shared list",syms=m[2].split(",").filter(Boolean);history.replaceState(null,"","#watch");
  modal(`<form><h3>Import a shared list?</h3><p><b>${esc(name)}</b> — ${syms.length} stocks: ${esc(syms.slice(0,12).join(", "))}${syms.length>12?"…":""}</p>
    <div class="acts"><button type="button" class="ghost" data-mclose>No thanks</button><button class="btn" type="submit">Import as a new list</button></div></form>`,async()=>{await vpxLoad();
    const w=wlGet(),id=wlNewId();w.lists.push({id,name,items:[]});parseSyms(syms.join(",")).ok.forEach(s=>wlAdd(id,s));w.active=id;wlSave();go("watch")});return true}

/* ── sync between devices: secret GitHub gist ── */
const GH="https://api.github.com",GFILE="pkc-radar-us-watchlists.json";
const syncCfg={get(){return store.get("wlsync",null)},set(v){store.set("wlsync",v)}};
async function gh(path,opt,tok){const r=await fetch(GH+path,{method:opt?.method||"GET",body:opt?.body,headers:{"Accept":"application/vnd.github+json","Authorization":"Bearer "+tok,...(opt?.body?{"Content-Type":"application/json"}:{})}});
  if(!r.ok)throw new Error(r.status===401?"GitHub refused the token (401). Check it has the gist permission.":`GitHub error ${r.status}`);return r.json()}
function wlMerge(a,b){ // first connect on a device that already has lists: keep everything from both
  const newer=(a.updated||0)>=(b.updated||0)?a:b,older=newer===a?b:a,out=wlNorm(JSON.parse(JSON.stringify(newer)));
  for(const L of older.lists){let T=out.lists.find(x=>x.name.trim().toLowerCase()===L.name.trim().toLowerCase());if(!T){T={id:wlNewId(),name:L.name,items:[]};out.lists.push(T)}
    for(const it of L.items){const e=T.items.find(i=>i.s===it.s);if(!e)T.items.push({...it});else if(it.d<e.d)Object.assign(e,it)}}
  for(const [k,v] of Object.entries(older.meta||{}))if(!out.meta[k])out.meta[k]=v;
  const seen=new Set(out.log.map(e=>e.s+e.d+e.o));for(const e of older.log||[])if(!seen.has(e.s+e.d+e.o))out.log.push(e);
  out.updated=Date.now();return out}
async function syncConnect(tok){const w=wlGet();const mine=await gh("/gists?per_page=100",null,tok);let g=mine.find(x=>x.files&&x.files[GFILE]);
  if(g){const full=await gh("/gists/"+g.id,null,tok);let remote=null;try{remote=JSON.parse(full.files[GFILE].content)}catch(e){}
    const localHas=w.lists.some(l=>l.items.length),remoteHas=remote&&Array.isArray(remote.lists)&&remote.lists.some(l=>l.items?.length);
    WL=localHas&&remoteHas?wlMerge(w,wlNorm(remote)):remoteHas?wlNorm(remote):w;wlSave(true);
    await gh("/gists/"+g.id,{method:"PATCH",body:JSON.stringify({files:{[GFILE]:{content:JSON.stringify(WL)}}})},tok)}
  else g=await gh("/gists",{method:"POST",body:JSON.stringify({description:"PKC Sector Radar US watchlists",public:false,files:{[GFILE]:{content:JSON.stringify(w)}}})},tok);
  syncCfg.set({tok,id:g.id,at:Date.now(),err:null})}
async function syncPull(){const c=syncCfg.get();if(!c)return;try{const full=await gh("/gists/"+c.id,null,c.tok);const remote=JSON.parse(full.files[GFILE]?.content||"null");
    if(remote&&(remote.updated||0)>(wlGet().updated||0)){WL=wlNorm(remote);wlSave(true);if(st.tab==="watch")renderWatch();toast("Watchlists updated from your other device")}
    c.at=Date.now();c.err=null}catch(e){c.err=e.message}syncCfg.set(c)}
let syncT=null;
function syncPushSoon(){const c=syncCfg.get();if(!c)return;clearTimeout(syncT);syncT=setTimeout(async()=>{try{await gh("/gists/"+c.id,{method:"PATCH",body:JSON.stringify({files:{[GFILE]:{content:JSON.stringify(wlGet())}}})},c.tok);c.at=Date.now();c.err=null}catch(e){c.err=e.message;toast("Sync failed — saved on this device")}syncCfg.set(c)},1500)}
function syncDialog(){const c=syncCfg.get();
  modal(c?`<form><h3>Sync is on</h3><p>Your watchlists are saved to a private GitHub gist and kept the same on every device where you connect the same token. Last synced: ${c.at?new Date(c.at).toLocaleString("en-US"):"–"}.${c.err?`<br><span class="err">${esc(c.err)}</span>`:""}</p>
      <p style="font-size:15px"><b>Telegram alerts:</b> save this same token as the <code>GIST_TOKEN</code> secret in your repository and the Telegram bot reads these lists — your pivot, stop and target levels — live during market hours (README → Telegram alerts).</p>
      <div class="acts"><button type="button" class="ghost" data-mclose>Close</button><button type="button" class="ghost" id="syncnow">Sync now</button><button class="btn danger" type="submit">Turn off on this device</button></div></form>`
    :`<form><h3>Sync across your devices</h3><p>Watchlists are saved in this browser. To see the same lists on your phone and PC, store them in a private GitHub gist (free, only you can change it):</p>
      <ol><li>Open <a href="https://github.com/settings/tokens/new?scopes=gist&description=PKC%20Sector%20Radar%20US%20watchlists" target="_blank" rel="noopener">this GitHub page</a> (signed in as you). It creates a token that can only read and write gists. Choose an expiry, then click <b>Generate token</b>.</li>
      <li>Copy the token (starts with <code>ghp_</code>) and paste it below. Do the same on your other device.</li></ol>
      <input name="tok" placeholder="ghp_…" autocomplete="off" spellcheck="false" aria-label="GitHub token" required>
      <p style="font-size:14px">The token stays in this browser only. The gist is secret (not listed anywhere), but anyone given its exact address could read it — don't put anything private in notes.</p>
      <p class="err" id="syncerr" hidden></p>
      <div class="acts"><button type="button" class="ghost" data-mclose>Cancel</button><button class="btn" type="submit">Connect</button></div></form>`,
  async fd=>{if(c){syncCfg.set(null);toast("Sync turned off on this device");renderWatch();return}
    const tok=String(fd.get("tok")||"").trim();try{await syncConnect(tok);toast("Sync connected");renderWatch()}catch(e){const er=$("#syncerr");er.hidden=false;er.textContent=e.message;return false}});
  $("#syncnow")?.addEventListener("click",async()=>{await syncPull();syncPushSoon();modalClose();toast("Synced")})}

function historyHtml(){const w=wlGet();if(!w.log.length)return "";
  const rows=w.log.map((e,i)=>{const ret=isNum(e.po)&&isNum(e.p)&&e.p>0?(e.po/e.p-1)*100:null,br=isNum(e.bo)&&isNum(e.b)&&e.b>0?(e.bo/e.b-1)*100:null;

    ${kv("Fund rating",rsPill(x.fr))}${kv("P/E",n(x.pe))}${kv("P/S",n(x.ps))}${kv("PEG",n(x.peg,2))}
    ${kv("Profit YoY",g(x.pat_yoy))}${kv("Revenue YoY",g(x.rev_yoy))}${kv("Profit, last 4 qtrs",g(x.pat_ttm_g))}${kv("Revenue, last 4 qtrs",g(x.rev_ttm_g))}
    ${kv(`ROE${fyl}`,n(x.roe,1,"%"))}${x.fin?"":kv(`ROCE${fyl}`,n(x.roce,1,"%"))}${x.fin?"":kv("Debt / equity",n(x.de,2))}${x.fin?kv("Net margin",n(x.npm,1,"%")):kv("Operating margin",n(x.opm,1,"%")+(isNum(x.opm_chg)?` <span class="${cls(x.opm_chg)}" style="font-size:13px">(${x.opm_chg>0?"+":""}${x.opm_chg.toFixed(1)})</span>`:""))}
    ${x.fin?"":kv(`Free cash flow${x.fy?" FY"+x.fy.slice(2):""}`,isNum(x.fcf)?usdM(x.fcf)+(isNum(x.fcf_yield)?` <span style="font-size:13px;color:var(--muted)">(${x.fcf_yield.toFixed(1)}% yield)</span>`:""):"–")}${kv("Shares, 1 yr",isNum(x.sh_yoy)?`<span class="${x.sh_yoy<0?"up":x.sh_yoy>5?"down":""}">${sgn(x.sh_yoy,1)}</span>`:"–")}
    ${kv("Next earnings",x.next_results?esc(fmtDate(x.next_results))+(x.next_est?' <span style="font-size:13px;color:var(--muted)">(est.)</span>':""):"–")}${kv("Last earnings",x.results_day?esc(fmtDate(x.results_day)):"–")}
  </dl>`;
  const q=fd?.q||[];
  if(q.length){
    const rows=q.map((r,i)=>{const ya=q[i-4];const yoy=ya&&isNum(ya[2])&&ya[2]>0&&isNum(r[2])?(r[2]/ya[2]-1)*100:null;
      return `<tr><td>${esc(r[0])}</td><td>${fmtM(r[1])}</td><td>${fmtM(r[2])}</td><td>${isNum(r[3])?r[3].toFixed(2):"–"}</td><td>${isNum(r[4])?r[4].toFixed(1):isNum(r[5])?r[5].toFixed(1):"–"}</td><td class="${cls(yoy)}">${yoy==null?"–":sgn(Math.max(-100,Math.min(999,yoy)),0)}</td></tr>`}).reverse().join("");
    h+=`<p class="dsub">Quarterly results · $ millions · ${esc(fd.basis||"")}</p><div class="fscroll"><table class="ftbl"><thead><tr><th>Quarter</th><th>Revenue</th><th>Net income</th><th>EPS</th><th>${x.fin?"Net":"Op."} margin %</th><th>Profit YoY</th></tr></thead><tbody>${rows}</tbody></table></div>`;
  }
  if(isNum(x.inst)||isNum(x.insiders)){
    const hs=fd?.h||[];
    h+=`<p class="dsub">Ownership · institutions ${n(x.inst,1,"%")}${isNum(x.inst_1y)?` (${sgn(x.inst_1y,1," pts")} in a year)`:isNum(x.inst_1q)?` (${sgn(x.inst_1q,1," pts")} in 3 months)`:""} · insiders ${n(x.insiders,1,"%")}${isNum(x.inst_count)?` · ${x.inst_count.toLocaleString("en-US")} institutions`:""}</p>`;
    if(hs.length>1)h+=`<div class="fscroll"><table class="ftbl"><thead><tr><th>Snapshot</th><th>Insiders %</th><th>Institutions %</th><th>Institutions</th></tr></thead><tbody>${[...hs].reverse().map(r=>`<tr><td>${esc(r[0])}</td><td>${isNum(r[1])?r[1].toFixed(2):"–"}</td><td>${isNum(r[2])?r[2].toFixed(2):"–"}</td><td>${isNum(r[3])?r[3].toLocaleString("en-US"):"–"}</td></tr>`).join("")}</tbody></table></div>`;
  }
  const it=fd?.it||[];
  h+=`<p class="dsub">Insider trades, open market (SEC Form 4) · last 90 days: bought ${isNum(x.ins_buy90)?usdM(x.ins_buy90):"$0M"}${x.ins_buyers90?` by ${x.ins_buyers90}`:""} · sold ${isNum(x.ins_sell90)?usdM(x.ins_sell90):"$0M"}</p>`;
  const role=t=>{t=String(t||"");if(/\bCEO\b|Chief Executive/i.test(t))return "CEO";if(/\bCFO\b|Chief Financial|\bPFO\b/i.test(t))return "CFO";if(/Chair/i.test(t))return "Chair";if(/President/i.test(t))return "President";if(/\bCOO\b|Chief Operating/i.test(t))return "COO";
    if(t==="D"||/^Director/i.test(t))return "Director";if(t==="T"||/10%/.test(t))return "10% owner";if(t==="O"||t==="DO")return "Officer";return t.length>16?t.slice(0,15)+"…":t};
  const nm=t=>{t=String(t||"");return t.length>20?t.slice(0,19)+"…":t};
  const dshort=d=>{const t=new Date(String(d).slice(0,10)+"T00:00:00");return isNaN(t)?d:t.toLocaleDateString("en-US",{month:"short",day:"numeric",year:"2-digit"})};
  if(it.length)h+=`<div class="fscroll"><table class="ftbl"><thead><tr><th>Date</th><th>Insider</th><th>Role</th><th>Trade</th><th>Value</th><th>Price</th><th>Shares</th></tr></thead><tbody>${it.map(r=>`<tr><td>${esc(dshort(r[0]))}</td><td style="text-align:left" title="${esc(r[1])}">${esc(nm(r[1]))}</td><td style="text-align:left" title="${esc(r[2])}">${esc(role(r[2]))}</td><td class="${r[3]==="P"?"up":"down"}" style="font-weight:700">${r[3]==="P"?"Buy":"Sell"}</td><td>${isNum(r[6])?usdM(r[6]):"–"}</td><td>${isNum(r[5])?"$"+r[5].toFixed(2):"–"}</td><td>${isNum(r[4])?r[4].toLocaleString("en-US"):"–"}</td></tr>`).join("")}</tbody></table></div>`;
  if(x.flags?.length)h+=`<p class="dsub">Red flags</p><ul class="flags">${x.flags.map(f=>`<li>${esc(f)}</li>`).join("")}</ul>`;
  return h+`<p class="note" style="margin:10px 0 0">Source: the company's 10-Q and 10-K filings (SEC EDGAR XBRL), insider trades from SEC Form 4, ownership and earnings dates from Yahoo Finance. P/E uses today's market cap. Fund rating 1–99 ranks every stock on profit growth (latest two quarters and last four), revenue growth, ROE and margin trend — 70% growth, 30% quality. Companies that file 20-F (most foreign ADRs) have no quarterly XBRL data.</p></div>`;
}

/* ════════════════════ global search ════════════════════ */
const QS={list:null,sel:0,items:[]};
async function searchList(){
  if(QS.list)return QS.list;if(!D.stocks)return [];
  const L=D.stocks.map(x=>({s:x.s,n:(x.lbl?x.lbl+" · ":"")+(x.n||""),x})),have=new Set(L.map(o=>o.s));
  try{const d=await vpLoad("completed");for(const r of objs(d.results))if(r.symbol&&!have.has(r.symbol)){have.add(r.symbol);L.push({s:r.symbol,n:r["Company Name"]||"",ex:r.exchange})}}catch(e){}
  return QS.list=L;
}
function qScore(o,q){const s=o.s,n=o.n.toUpperCase();if(s===q)return 0;if(s.startsWith(q))return 1;if(n.startsWith(q))return 2;if(s.includes(q))return 3;if(n.split(/[\s.&()-]+/).some(w=>w.startsWith(q)))return 4;return n.includes(q)?5:9}
function hl(t,q){const i=t.toUpperCase().indexOf(q);return i<0?esc(t):esc(t.slice(0,i))+"<mark>"+esc(t.slice(i,i+q.length))+"</mark>"+esc(t.slice(i+q.length))}
function closeSearch(){$("#gqres").hidden=true;$("#gq").setAttribute("aria-expanded","false")}
async function runSearch(){
  const inp=$("#gq"),box=$("#gqres"),raw=inp.value.trim(),q=raw.toUpperCase();
  if(!q){closeSearch();return}
  const L=await searchList();if(inp.value.trim().toUpperCase()!==q)return;
  const res=L.map(o=>[qScore(o,q),o]).filter(a=>a[0]<9).sort((a,b)=>a[0]-b[0]||(b[1].x?.mc||0)-(a[1].x?.mc||0)).slice(0,10).map(a=>a[1]);
  QS.items=res;QS.sel=0;
  box.innerHTML=res.length?res.map((o,i)=>{const x=o.x,right=x?`<span class="num ${cls(x.r["1D"])}">${sgn(x.r["1D"])}</span><small>$${inr(x.px)}${x.k==="e"?" · ETF":isNum(x.mc)?` · ${mcap(x.mc)}`:""}</small>`:`<small>VPCI list only</small>`;
      return `<button type="button" class="opt" role="option" id="gqo${i}" aria-selected="${i===0}" data-i="${i}"><b>${hl(o.s,q)}</b><span class="rt">${right}</span><span class="nm">${hl(o.n,q)}</span></button>`}).join("")+`<div class="hint">↑ ↓ to move · Enter to open · Esc to close</div>`
    :`<div class="none">Nothing matches “${esc(raw)}”. Searchable: US stocks that pass the filters (price ≥ $${D.meta.filters?.min_price}, dollar volume ≥ $${D.meta.filters?.min_median_turnover_m}M, market cap ≥ $${D.meta.filters?.min_market_cap_m}M), liquid ETFs, plus every stock in the VPCI list.</div>`;
  box.hidden=false;inp.setAttribute("aria-expanded","true");
}
function pickSearch(i){const o=QS.items[i];if(!o)return;const inp=$("#gq");closeSearch();inp.value="";inp.blur();openDrawer(o.s,o.ex)}
$("#gq").addEventListener("input",runSearch);
$("#gq").addEventListener("focus",()=>{searchList();if($("#gq").value.trim())runSearch()});
$("#gq").addEventListener("blur",()=>setTimeout(closeSearch,150));
$("#gq").addEventListener("keydown",e=>{const box=$("#gqres");
  if(e.key==="Escape"){e.stopPropagation();closeSearch();e.target.blur();return}
  if(box.hidden||!QS.items.length)return;
  if(e.key==="ArrowDown"||e.key==="ArrowUp"){e.preventDefault();QS.sel=(QS.sel+(e.key==="ArrowDown"?1:-1)+QS.items.length)%QS.items.length;
    box.querySelectorAll(".opt").forEach((b,i)=>b.setAttribute("aria-selected",i===QS.sel));$("#gqo"+QS.sel)?.scrollIntoView({block:"nearest"})}
  if(e.key==="Enter"){e.preventDefault();pickSearch(QS.sel)}});
$("#gqres").addEventListener("mousedown",e=>{const b=e.target.closest(".opt");if(b){e.preventDefault();pickSearch(+b.dataset.i)}});
document.addEventListener("keydown",e=>{if(e.key==="/"&&!/INPUT|TEXTAREA|SELECT/.test(document.activeElement?.tagName||"")&&$("#drawer").hidden){e.preventDefault();$("#gq").focus()}});

$("#tabs").addEventListener("click",e=>{const b=e.target.closest(".tab");if(b)go(b.dataset.v)});
document.addEventListener("click",e=>{
  const sb=e.target.closest(".symbtn");if(sb){openDrawer(sb.dataset.sym,sb.dataset.ex);return}
  if(e.target.closest("[data-close]")||e.target.id==="scrim"){closeDrawer();return}
  const jp=e.target.closest("[data-jump]");if(jp){document.getElementById(jp.dataset.jump)?.scrollIntoView({behavior:"smooth",block:"start"});return}
  const sg=e.target.closest("[data-scan-go]");if(sg){closeDrawer(true);st.scan=sg.dataset.scanGo;st.scanView="lib";go("scanners");return}
  const tg=e.target.closest("[data-theme-go]");if(tg){closeDrawer(true);st.group="Themes";st.open=tg.dataset.themeGo;st.view="bars";go("rotation");setTimeout(()=>document.querySelector(`.brow[data-g="${CSS.escape(st.open)}"]`)?.scrollIntoView({block:"center"}),60);return}
  const s=e.target.closest("[data-seg]");
  if(s){const k=s.dataset.seg,v=s.dataset.val;
    if(k==="vpmode"){VP.mode=v;renderVpci();return}
    if(k==="vpprorate"){VP.prorate=v==="on";renderVpci();return}
    if(k==="vview"){VP.view=v;vpTab();return}
    if(k==="wlview"){st.wl.view=v;drawWatch();return}
    if(k==="scanView"){st.scanView=v;store.set("scanView",v);if(location.hash.slice(1)!==(v==="s2"?"stage2":"scanners"))history.replaceState(null,"","#"+(v==="s2"?"stage2":"scanners"));renderScanners();return}
    if(k.startsWith("s2_")){st.s2[k.slice(3)]=v;store.set("s2",st.s2);if(st.tbl.s2)st.tbl.s2.show=100;s.parentElement.querySelectorAll("button").forEach(b=>b.setAttribute("aria-pressed",b===s));drawStage2();return}
    if(k.startsWith("b_")){st.bx[k.slice(2)]=v;store.set("bx",st.bx);if(st.tbl.bases)st.tbl.bases.show=100;s.parentElement.querySelectorAll("button").forEach(b=>b.setAttribute("aria-pressed",b===s));drawBases();return}
    if(k==="scanTop"){st.scanTop=+v;store.set("scanTop",st.scanTop);renderScanners();return}
    if(k==="scanFund"){st.scanFund=+v;store.set("scanFund",st.scanFund);renderScanners();return}
    if(k==="fundmin"){st.rs.fmin=+v;store.set("rs",st.rs);s.parentElement.querySelectorAll("button").forEach(b=>b.setAttribute("aria-pressed",b===s));drawRS();return}
    if(k==="rskind"){st.rs.kind=v;st.rs.sec="";store.set("rs",st.rs);if(st.tbl.rs)st.tbl.rs.show=100;renderRS();return}
    if(k==="etfSet"){st.etfSet=v;st.open=null;store.set("etfSet",v);renderRotation();return}
    if(k==="rsmin"){st.rs.min=+v;store.set("rs",st.rs);s.parentElement.querySelectorAll("button").forEach(b=>b.setAttribute("aria-pressed",b===s));drawRS();return}
    st[k]=v;if(k==="group")st.open=null;store.set("prefs",{period:st.period,group:st.group,agg:st.agg,sort:st.sort,view:st.view});
    if(k==="period")renderPulse();renderRotation();return}
  const vt=e.target.closest("[data-vtab]");if(vt){VP.tab=vt.dataset.vtab;document.querySelectorAll("[data-vtab]").forEach(b=>b.setAttribute("aria-pressed",b===vt));vpTab();return}
  const bp=e.target.closest("[data-bpreset]");if(bp){bPreset(bp.dataset.bpreset);return}
  const s2p=e.target.closest("[data-s2preset]");if(s2p){s2Preset(s2p.dataset.s2preset);return}
  const sc=e.target.closest("[data-scan]");if(sc){st.scan=sc.dataset.scan;store.set("scan2",st.scan);renderScanners();return}
  const hp=e.target.closest("[data-hp]");if(hp){st.period=hp.dataset.hp;st.sort="ret";renderPulse();renderRotation();return}
  if(e.target.closest(".members")||e.target.closest("details")||e.target.closest("#drawer"))return;
  const r=e.target.closest(".brow,.heat tr.hr");if(r){st.open=st.open===r.dataset.g?null:r.dataset.g;renderRotation();return}
});
document.addEventListener("keydown",e=>{
  if(e.key==="Escape"){closeDrawer();return}
  const r=e.target.closest?.(".brow,.heat tr.hr,[data-hp]");if(r&&e.target===r&&(e.key==="Enter"||e.key===" ")){e.preventDefault();r.click();document.querySelector(`[data-g="${CSS.escape(r.dataset.g||"")}"]`)?.focus()}
});
window.addEventListener("hashchange",()=>{const t=location.hash.slice(1);if(t==="stage2"){if(st.tab!=="scanners"||st.scanView!=="s2")go("stage2");return}if(TABS.includes(t)&&(t!==st.tab||(t==="scanners"&&st.scanView==="s2"))){if(t==="scanners")st.scanView="lib";go(t)}});
$("#themeBtn").addEventListener("click",()=>{const d=document.documentElement,cur=d.dataset.theme||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light");d.dataset.theme=cur==="dark"?"light":"dark";store.set("theme",d.dataset.theme)});
(()=>{const t=store.get("theme",null);if(t)document.documentElement.dataset.theme=t;Object.assign(st,store.get("prefs",{}));Object.assign(st.rs,store.get("rs",{}));st.etfSet=store.get("etfSet",st.etfSet);Object.assign(st.bx,store.get("bx",{}));Object.assign(st.s2,store.get("s2",{}));st.scanView=store.get("scanView","lib");st.scan=store.get("scan2",st.scan);st.scanTop=+store.get("scanTop",0)||0;st.scanFund=+store.get("scanFund",0)||0;
  const h=location.hash.slice(1);if(h==="stage2"){st.scanView="s2";st.tab="scanners"}else{if(h==="scanners")st.scanView="lib";st.tab=TABS.includes(h)?h:store.get("tab","rotation")}})();

load().then(()=>{index();renderHeader();renderFoot();render();updateWlBadge();wlCheckShared();syncPull();vpxLoad().then(()=>{refreshStars();updateWlBadge()})}).catch(err=>{
  $("#asof").textContent="";
  $("#view").innerHTML=`<div class="err"><b>Data files could not be loaded.</b><br>${esc(err.message)}. The evening job may not have run yet — open the Actions tab on GitHub, run “Daily update” once, then reload.</div>`;
});
